  function stopRps() {
    if (rpsRevealTimeout) {
      clearTimeout(rpsRevealTimeout);
      rpsRevealTimeout = null;
    }
    rpsLocked = false;
  }

  function startRpsLevel() {
    stopRps();
    const cfg = levelCfg();
    rpsPlayerHandEl.textContent = "❔";
    rpsCpuHandEl.textContent = "❔";
    rpsPlayerScoreEl.textContent = "0";
    rpsCpuScoreEl.textContent = "0";
    rpsResultEl.className = "rps-result";
    rpsResultEl.textContent = "Choose your hand!";
    taskEl.textContent = "Win " + cfg.target + " rounds! Choose your hand. ✊✋✌️";
  }

  function rpsPop(el) {
    el.classList.remove("pop");
    void el.offsetWidth;
    el.classList.add("pop");
  }

  function playRps(handKey) {
    if (currentGameKey !== "rps" || rpsLocked || busy) return;
    const cfg = levelCfg();
    let player = RPS_HANDS[0];
    for (let i = 0; i < RPS_HANDS.length; i++) {
      if (RPS_HANDS[i].key === handKey) { player = RPS_HANDS[i]; break; }
    }
    const cpu = RPS_HANDS[randInt(0, RPS_HANDS.length - 1)];
    const s = session;
    rpsLocked = true;

    rpsPlayerHandEl.textContent = player.emoji;
    rpsCpuHandEl.textContent = cpu.emoji;
    rpsPop(rpsPlayerHandEl);
    rpsPop(rpsCpuHandEl);

    let outcome;
    if (player.key === cpu.key) outcome = "tie";
    else if (RPS_BEATS[player.key] === cpu.key) outcome = "win";
    else outcome = "lose";

    if (outcome === "win") {
      done++;
      updateDots();
      rpsPlayerScoreEl.textContent = done;
      rpsResultEl.className = "rps-result win";
      rpsResultEl.textContent = "You win! 🎉";
      taskEl.textContent = "Great choice! " + player.label + " beats " + cpu.label + ".";
      soundCorrect();
      showEmoji(true);

      if (done >= cfg.target) {
        taskEl.textContent = "You won all " + cfg.target + " rounds! 🎉";
        rpsRevealTimeout = setTimeout(function () {
          if (s !== session) return;
          rpsRevealTimeout = null;
          busy = true;
          completeLevel();
        }, 950);
        return;
      }
    } else if (outcome === "lose") {
      mistakes++;
      renderHearts();
      rpsCpuScoreEl.textContent = mistakes;
      rpsResultEl.className = "rps-result lose";
      rpsResultEl.textContent = "Computer wins! 😅";
      taskEl.textContent = "Oops! " + cpu.label + " beats " + player.label + ".";
      soundWrong();
      showEmoji(false);

      if (mistakes >= maxWrong()) {
        taskEl.textContent = "No more lives! 😢";
        rpsRevealTimeout = setTimeout(function () {
          if (s !== session) return;
          rpsRevealTimeout = null;
          busy = true;
          failLevel();
        }, 950);
        return;
      }
    } else {
      rpsResultEl.className = "rps-result tie";
      rpsResultEl.textContent = "It's a tie! 🤝";
      taskEl.textContent = "Tie! Both chose " + player.label + ". Try again.";
      beep(440, 0, 0.12, "triangle", 0.12);
    }

    rpsRevealTimeout = setTimeout(function () {
      if (s !== session) return;
      rpsRevealTimeout = null;
      rpsLocked = false;
      rpsResultEl.className = "rps-result";
      rpsResultEl.textContent = "Choose your next hand!";
      taskEl.textContent = "Win " + cfg.target + " rounds! " + (maxWrong() - mistakes) + " lives left. ✊✋✌️";
    }, 900);
  }

  /* =======================================================================
     WHACK-A-MOLE GAME
     ======================================================================= */

  function buildMoleBoard() {
    moleBoard.innerHTML = "";
    moleHoles = [];
    for (let i = 0; i < MOLE_HOLES; i++) {
      const hole = document.createElement("button");
      hole.type = "button";
      hole.className = "mole-hole";
      hole.dataset.hole = String(i);
      hole.setAttribute("aria-label", "Empty hole");
      const mole = document.createElement("span");
      mole.className = "mole";
      mole.textContent = "🐹";
      hole.appendChild(mole);
      hole.addEventListener("click", function () { whackMole(i); });
      moleBoard.appendChild(hole);
      moleHoles.push(hole);
    }
  }

  function sizeMoleBoard() {
    if (currentGameKey !== "mole") return;
    const stageW = stageMole.clientWidth;
    const stageH = stageMole.clientHeight;
    if (!stageW || !stageH) return;
    const size = Math.floor(Math.max(180, Math.min(520, stageW, stageH - 6)));
    moleBoard.style.width = size + "px";
    moleBoard.style.height = size + "px";
  }

  function resetMoleHoles() {
    moleHoles.forEach(function (hole) {
      hole.classList.remove("up", "bonk", "miss");
      hole.setAttribute("aria-label", "Empty hole");
    });
    moleActiveIndex = -1;
  }

  function stopMoleGame() {
    if (moleSpawnTimeout) {
      clearTimeout(moleSpawnTimeout);
      moleSpawnTimeout = null;
    }
    if (moleHideTimeout) {
      clearTimeout(moleHideTimeout);
      moleHideTimeout = null;
    }
    moleRunning = false;
    resetMoleHoles();
  }

  function startMoleLevel() {
    stopMoleGame();
    const cfg = levelCfg();
    moleLastIndex = -1;
    moleRunning = true;
    resetMoleHoles();
    sizeMoleBoard();
    taskEl.textContent = "Whack " + cfg.target + " moles! Tap the mole when it pops up. 🐹";
    const s = session;
    moleSpawnTimeout = setTimeout(function () {
      if (s !== session) return;
      moleSpawnTimeout = null;
      spawnMole();
    }, 500);
  }

  function scheduleMoleSpawn(delay) {
    if (!moleRunning) return;
    if (moleSpawnTimeout) clearTimeout(moleSpawnTimeout);
    const s = session;
    moleSpawnTimeout = setTimeout(function () {
      if (s !== session) return;
      moleSpawnTimeout = null;
      spawnMole();
    }, delay);
  }

  function spawnMole(forcedIndex) {
    if (currentGameKey !== "mole" || !moleRunning || moleActiveIndex >= 0 || busy) return;
    if (moleHoles.length !== MOLE_HOLES) buildMoleBoard();
    let idx;
    if (typeof forcedIndex === "number") {
      idx = forcedIndex;
    } else {
      let guard = 0;
      do {
        idx = randInt(0, MOLE_HOLES - 1);
        guard++;
      } while (idx === moleLastIndex && guard < 20);
    }
    if (idx < 0 || idx >= MOLE_HOLES) return;

    const cfg = levelCfg();
    const s = session;
    moleActiveIndex = idx;
    moleLastIndex = idx;
    const hole = moleHoles[idx];
    hole.classList.remove("bonk", "miss");
    hole.classList.add("up");
    hole.setAttribute("aria-label", "Whack the mole!");

    moleHideTimeout = setTimeout(function () {
      if (s !== session) return;
      if (!moleRunning || moleActiveIndex !== idx) return;
      moleHideTimeout = null;
      hole.classList.remove("up");
      hole.setAttribute("aria-label", "Empty hole");
      moleActiveIndex = -1;
      scheduleMoleSpawn(cfg.gap);
    }, cfg.visible);
  }

  function whackMole(index) {
    if (currentGameKey !== "mole" || !moleRunning || busy) return;
    if (moleActiveIndex < 0) return;

    if (index !== moleActiveIndex) {
      mistakes++;
      renderHearts();
      soundWrong();
      showEmoji(false);
      const wrongHole = moleHoles[index];
      if (wrongHole) {
        wrongHole.classList.remove("miss");
        void wrongHole.offsetWidth;
        wrongHole.classList.add("miss");
        setTimeout(function () { wrongHole.classList.remove("miss"); }, 380);
      }
      taskEl.textContent = "Oops! Tap the mole, not the empty hole.";

      if (mistakes >= maxWrong()) {
        stopMoleGame();
        taskEl.textContent = "No more lives! 😢";
        busy = true;
        const s = session;
        setTimeout(function () {
          if (s !== session) return;
          failLevel();
        }, 650);
      }
      return;
    }

    const cfg = levelCfg();
    const hole = moleHoles[moleActiveIndex];
    if (moleHideTimeout) {
      clearTimeout(moleHideTimeout);
      moleHideTimeout = null;
    }
    hole.classList.remove("up");
    hole.classList.add("bonk");
    hole.setAttribute("aria-label", "Empty hole");
    moleActiveIndex = -1;
    done++;
    updateDots();
    soundCorrect();
    showEmoji(true);

    if (done >= cfg.target) {
      moleRunning = false;
      taskEl.textContent = "You whacked all " + cfg.target + " moles! 🎉";
      busy = true;
      const s = session;
      setTimeout(function () {
        if (s !== session) return;
        completeLevel();
      }, 750);
      return;
    }

    taskEl.textContent = "Great whack! " + done + " / " + cfg.target + " moles. 🐹";
    scheduleMoleSpawn(Math.max(220, cfg.gap - 100));
  }

  /* =======================================================================
     BUTTONS
     ======================================================================= */

  document.getElementById("btn-login").addEventListener("click", doLogin);
  loginNameInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); doLogin(); }
  });
  document.getElementById("btn-change-name").addEventListener("click", function () {
    loginNameInput.value = playerName || "";
    showScreen("login");
    setTimeout(function () { loginNameInput.focus(); }, 120);
  });

  document.querySelectorAll(".game-card").forEach(function (card) {
    card.addEventListener("click", function () { chooseGame(card.dataset.game); });
  });

  document.getElementById("btn-levels-games").addEventListener("click", function () {
    session++;
    stopSnake();
    stopButterflyGame();
    stopRps();
    stopMoleGame();
    busy = false;
    resetProgress();
    showScreen("games");
  });

  document.getElementById("btn-game-back").addEventListener("click", function () {
    session++;
    busy = false;
    firstCard = null;
    stopSnake();
    stopButterflyGame();
    stopRps();
    stopMoleGame();
    resetDrag();
    clearHighlights();
    renderLevels();
    showScreen("levels");
  });

  document.getElementById("btn-replay").addEventListener("click", function () {
    overlay.classList.add("hidden");
    startLevel(levelIndex);
  });
  btnNext.addEventListener("click", function () {
    overlay.classList.add("hidden");
    if (btnNext.dataset.action === "next") startLevel(levelIndex + 1);
    else { renderLevels(); showScreen("levels"); }
  });
  document.getElementById("btn-levels").addEventListener("click", function () {
    overlay.classList.add("hidden");
    renderLevels();
    showScreen("levels");
  });

  document.getElementById("btn-try-again").addEventListener("click", function () {
    overlayFail.classList.add("hidden");
    startLevel(levelIndex);
  });
  document.getElementById("btn-fail-levels").addEventListener("click", function () {
    overlayFail.classList.add("hidden");
    renderLevels();
    showScreen("levels");
  });

  window.addEventListener("keydown", function (e) {
    if (currentGameKey !== "snake" || !screens.game.classList.contains("active")) return;
    const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    const dirs = {
      ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
      w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0]
    };
    const dir = dirs[key];
    if (dir) {
      e.preventDefault();
      setSnakeDirection(dir[0], dir[1]);
    }
  });

  document.querySelectorAll(".snake-key").forEach(function (btn) {
    btn.addEventListener("click", function () {
      const dirs = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
      const dir = dirs[btn.dataset.dir];
      if (dir) {
        getAudio();
        setSnakeDirection(dir[0], dir[1]);
      }
    });
  });

  window.addEventListener("keydown", function (e) {
    if (currentGameKey !== "butterfly" || !screens.game.classList.contains("active")) return;
    const key = e.key === " " ? " " : e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (key === " " || key === "ArrowUp" || key === "w") {
      e.preventDefault();
      flapButterfly();
    }
  });

  butterflyCanvas.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    getAudio();
    flapButterfly();
  });
  document.getElementById("butterfly-flap").addEventListener("click", function () {
    getAudio();
    flapButterfly();
  });

  document.querySelectorAll(".rps-choice").forEach(function (btn) {
    btn.addEventListener("click", function () {
      getAudio();
      playRps(btn.dataset.hand);
    });
  });

  window.addEventListener("resize", sizeMemoryBoard);
  window.addEventListener("resize", sizeMoleBoard);

  buildMoleBoard();

  /* =======================================================================
     INIT
     ======================================================================= */

  loginNameInput.value = playerName || "";
  if (playerName) greetingEl.textContent = "Hi, " + playerName + "! 👋";
  showScreen("login");
  setTimeout(function () {
    if (!playerName) loginNameInput.focus();
  }, 200);
})();
</script>
</body>
</html>
