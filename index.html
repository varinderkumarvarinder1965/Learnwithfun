<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Kids Games</title>
<style>
  :root {
    --ink: #334155;
    --muted: #64748b;
    --shape-size: clamp(96px, 20vw, 140px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    color: var(--ink);
    background: linear-gradient(160deg, #fdf2f8 0%, #e0f2fe 45%, #dcfce7 100%);
  }
  button { font-family: inherit; cursor: pointer; border: none; }

  .screen {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    padding: 16px;
  }
  .screen.active { display: flex; }

  /* ---------- LOGIN ---------- */
  #screen-login {
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 6px;
  }
  .art {
    font-size: clamp(30px, 8vw, 56px);
    letter-spacing: 6px;
    margin-bottom: 8px;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-10px); }
  }
  h1 { margin: 0; font-size: clamp(26px, 6vw, 46px); letter-spacing: 1px; }
  .sub {
    color: var(--muted);
    font-size: clamp(14px, 3vw, 20px);
    margin: 6px 0 18px;
  }
  .greeting {
    margin: 6px 0 0;
    font-size: clamp(15px, 3.4vw, 22px);
    font-weight: bold;
    color: #0ea5e9;
  }
  .btn {
    padding: 14px 26px;
    border-radius: 16px;
    font-size: clamp(15px, 3vw, 20px);
    font-weight: bold;
    background: #fff;
    color: var(--ink);
    box-shadow: 0 6px 0 rgba(0,0,0,.12), 0 8px 16px rgba(0,0,0,.08);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.12); }
  .btn.primary { background: linear-gradient(135deg, #38bdf8, #6366f1); color: #fff; }
  .btn.big {
    padding: 18px 60px;
    font-size: clamp(20px, 4.5vw, 30px);
    border-radius: 22px;
    background: linear-gradient(135deg, #34d399, #22c55e);
    color: #fff;
    box-shadow: 0 8px 0 #15803d, 0 14px 22px rgba(0,0,0,.15);
  }
  .btn.big:active { transform: translateY(5px); box-shadow: 0 3px 0 #15803d; }
  .link-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 14px;
    text-decoration: underline;
    margin-top: 14px;
    padding: 6px;
  }
  .name-input {
    width: min(340px, 82vw);
    padding: 15px 18px;
    font-size: clamp(18px, 4vw, 24px);
    text-align: center;
    font-family: inherit;
    color: var(--ink);
    background: #fff;
    border: 3px solid #cbd5e1;
    border-radius: 16px;
    outline: none;
    box-shadow: 0 6px 14px rgba(0,0,0,.08);
    margin-bottom: 14px;
  }
  .name-input:focus { border-color: #38bdf8; box-shadow: 0 0 0 4px rgba(56,189,248,.25); }
  .name-input.shake { animation: shake .4s ease; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25%     { transform: translateX(-10px); }
    50%     { transform: translateX(10px); }
    75%     { transform: translateX(-6px); }
  }

  /* ---------- GAME SELECT ---------- */
  #screen-games {
    align-items: center;
    justify-content: flex-start;
    text-align: center;
    padding-top: clamp(20px, 5vh, 56px);
    overflow-y: auto;
    touch-action: pan-y;
  }
  .games-header { margin-bottom: 18px; }
  .game-cards {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
    width: 100%;
    max-width: 760px;
  }
  .game-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 22px 20px;
    border-radius: 26px;
    background: #fff;
    box-shadow: 0 10px 24px rgba(0,0,0,.12), inset 0 0 0 4px rgba(255,255,255,.6);
    transition: transform .12s ease;
    color: var(--ink);
  }
  .game-card:active { transform: scale(.97); }
  .game-card.color-card { background: linear-gradient(160deg, #fff1f2, #e0f2fe); }
  .game-card.math-card  { background: linear-gradient(160deg, #fefce8, #dcfce7); }
  .game-card.word-card  { background: linear-gradient(160deg, #ede9fe, #fce7f3); }
  .game-card.memory-card { background: linear-gradient(160deg, #cffafe, #dbeafe); }
  .game-card.snake-card { background: linear-gradient(160deg, #dcfce7, #fef9c3); }
  .game-card.butterfly-card { background: linear-gradient(160deg, #fce7f3, #ede9fe); }
  .game-card.rps-card { background: linear-gradient(160deg, #dbeafe, #fee2e2); }
  .game-card.mole-card { background: linear-gradient(160deg, #fef3c7, #dcfce7); }
  .card-art { font-size: clamp(26px, 6vw, 40px); letter-spacing: 5px; }
  .card-title { font-size: clamp(20px, 4.5vw, 28px); font-weight: bold; }
  .card-sub { font-size: clamp(12px, 2.8vw, 16px); color: var(--muted); margin-bottom: 6px; }
  .card-play {
    margin-top: 4px;
    padding: 10px 30px;
    border-radius: 999px;
    font-weight: bold;
    font-size: clamp(14px, 3vw, 18px);
    color: #fff;
    background: linear-gradient(135deg, #38bdf8, #6366f1);
    box-shadow: 0 5px 0 #4338ca;
  }
  .math-card .card-play { background: linear-gradient(135deg, #f59e0b, #f97316); box-shadow: 0 5px 0 #b45309; }
  .word-card .card-play { background: linear-gradient(135deg, #a78bfa, #ec4899); box-shadow: 0 5px 0 #9333ea; }
  .memory-card .card-play { background: linear-gradient(135deg, #06b6d4, #3b82f6); box-shadow: 0 5px 0 #1d4ed8; }
  .snake-card .card-play { background: linear-gradient(135deg, #22c55e, #84cc16); box-shadow: 0 5px 0 #3f6212; }
  .butterfly-card .card-play { background: linear-gradient(135deg, #ec4899, #8b5cf6); box-shadow: 0 5px 0 #6b21a8; }
  .rps-card .card-play { background: linear-gradient(135deg, #ef4444, #3b82f6); box-shadow: 0 5px 0 #1e40af; }
  .rps-card .card-title { font-size: clamp(15px, 3.4vw, 22px); line-height: 1.08; }
  .mole-card .card-play { background: linear-gradient(135deg, #a16207, #65a30d); box-shadow: 0 5px 0 #3f6212; }
  @media (min-width: 920px) {
    .game-cards { grid-template-columns: repeat(3, minmax(0, 1fr)); max-width: 1040px; }
  }
  @media (max-height: 720px) {
    #screen-games { padding-top: 10px; }
    .games-header { margin-bottom: 8px; }
    .games-header h1 { font-size: clamp(20px, 5vw, 26px); }
    .greeting { margin-top: 0; }
    .game-cards { gap: 10px; }
    .game-card { padding: 10px 14px; gap: 2px; border-radius: 18px; }
    .card-art { font-size: clamp(18px, 5vw, 26px); letter-spacing: 3px; }
    .card-title { font-size: clamp(17px, 4vw, 21px); }
    .card-sub { font-size: 11px; margin-bottom: 2px; }
    .card-play { padding: 7px 24px; font-size: 13px; }
  }

  /* ---------- TOPBAR / LEVELS ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    max-width: 860px;
    margin: 0 auto 8px;
  }
  .topbar h2 { margin: 0; font-size: clamp(18px, 4vw, 28px); }
  .btn.icon {
    width: 52px; height: 52px; padding: 0; border-radius: 14px;
    font-size: 22px; display: flex; align-items: center; justify-content: center;
  }
  .spacer { width: 52px; }
  .levels-sub {
    text-align: center;
    color: var(--muted);
    font-size: clamp(13px, 2.8vw, 16px);
    margin: 0 auto 10px;
  }
  .level-grid {
    width: 100%;
    max-width: 860px;
    margin: 0 auto;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 14px;
    padding: 6px 2px 24px;
  }
  .level-card {
    position: relative;
    min-height: 122px;
    border-radius: 20px;
    background: linear-gradient(160deg, #ffffff, #eef2ff);
    box-shadow: 0 6px 14px rgba(0,0,0,.1);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    color: var(--ink);
    transition: transform .12s ease;
    padding: 12px;
    text-align: center;
  }
  .level-card.unlocked:active { transform: scale(.96); }
  .level-card .num {
    font-size: clamp(24px, 5vw, 34px);
    font-weight: bold;
    color: #6366f1;
    line-height: 1;
  }
  .level-card .lv-name { font-size: clamp(13px, 2.6vw, 15px); font-weight: bold; }
  .level-card .lv-stars { font-size: 15px; letter-spacing: 2px; }
  .level-card .lv-label { font-size: 12px; color: var(--muted); }
  .level-card.locked {
    background: #e2e8f0;
    color: #94a3b8;
    box-shadow: none;
    cursor: not-allowed;
  }
  .level-card.locked .num, .level-card.locked .lv-label { color: #94a3b8; }
  .level-card.locked .lock { font-size: 34px; }

  /* ---------- GAME SHARED ---------- */
  #screen-game { justify-content: space-between; overflow: hidden; }
  .game-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    max-width: 860px;
    margin: 0 auto;
  }
  .game-info { text-align: center; flex: 1; min-width: 0; }
  .game-info .level-name {
    font-weight: bold;
    font-size: clamp(14px, 3vw, 19px);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .progress-dots {
    display: flex; gap: 6px; justify-content: center; margin-top: 6px; flex-wrap: wrap;
  }
  .dot-item {
    width: 13px; height: 13px; border-radius: 50%;
    background: #cbd5e1;
    transition: background .2s ease, transform .2s ease;
  }
  .dot-item.done { background: #22c55e; transform: scale(1.15); }
  .game-counter {
    font-weight: bold; font-size: clamp(15px, 3vw, 20px);
    min-width: 52px; text-align: right;
  }
  .hearts {
    text-align: center;
    font-size: clamp(18px, 4.2vw, 28px);
    letter-spacing: 5px;
    margin-top: 4px;
    line-height: 1;
  }
  .task {
    text-align: center;
    margin: 6px auto 0;
    font-size: clamp(14px, 3vw, 20px);
    color: var(--muted);
    min-height: 1.4em;
    max-width: 720px;
  }
  .task b { color: var(--ink); }

  #stage { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .stage-view { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .stage-view.hidden { display: none; }

  /* ---------- COLOR GAME ---------- */
  .tray {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 120px;
  }
  .shape-wrap {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: grab;
    touch-action: none;
  }
  .shape-wrap.dragging { cursor: grabbing; z-index: 1000; }
  .shape-label {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 14px;
    margin-bottom: 10px;
    background: #fff;
    border-radius: 999px;
    font-weight: bold;
    font-size: clamp(14px, 3vw, 19px);
    box-shadow: 0 4px 10px rgba(0,0,0,.12);
    white-space: nowrap;
  }
  .shape-label .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
  .shape-slot {
    width: var(--shape-size);
    height: var(--shape-size);
    filter: drop-shadow(0 10px 12px rgba(0,0,0,.22));
    animation: pop .35s ease;
  }
  .shape-slot svg { width: 100%; height: 100%; display: block; }
  .shape-wrap:not(.dragging) .shape-slot { animation: idle 2.6s ease-in-out infinite; }
  @keyframes pop {
    0%   { transform: scale(0) rotate(-30deg); }
    70%  { transform: scale(1.1) rotate(6deg); }
    100% { transform: scale(1) rotate(0deg); }
  }
  @keyframes idle {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-8px); }
  }
  .bins {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(72px, 1fr));
    gap: clamp(8px, 2vw, 18px);
    width: 100%;
    max-width: 860px;
    margin: 0 auto;
    padding-bottom: 6px;
  }
  .bin {
    aspect-ratio: 1 / 1.02;
    border-radius: 16px 16px 24px 24px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    border: 4px solid rgba(255,255,255,.9);
    box-shadow: inset 0 -8px 16px rgba(0,0,0,.18), 0 8px 14px rgba(0,0,0,.12);
    transition: transform .14s ease, box-shadow .14s ease;
  }
  .bin.hover {
    transform: translateY(-10px) scale(1.06);
    box-shadow: 0 0 0 5px rgba(255,255,255,.75), 0 14px 22px rgba(0,0,0,.2);
  }
  .bin.correct { animation: bounce .5s ease; }
  .bin.wrong   { animation: shake .4s ease; }
  @keyframes bounce {
    0%,100% { transform: translateY(0) scale(1); }
    40%     { transform: translateY(-18px) scale(1.1); }
  }

  /* ---------- MATH GAME ---------- */
  .question-card {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(16px, 4vh, 30px);
    width: 100%;
  }
  .question {
    font-size: clamp(38px, 10vw, 72px);
    font-weight: bold;
    color: #1e293b;
    background: #fff;
    padding: clamp(14px, 3vw, 24px) clamp(22px, 6vw, 48px);
    border-radius: 26px;
    box-shadow: 0 10px 24px rgba(0,0,0,.12);
    text-align: center;
    min-width: min(320px, 86vw);
    animation: qIn .3s ease;
  }
  @keyframes qIn {
    from { transform: scale(.85); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }
  .answers {
    display: grid;
    grid-template-columns: repeat(2, minmax(120px, 1fr));
    gap: clamp(10px, 2.5vw, 18px);
    width: 100%;
    max-width: 480px;
  }
  .answer {
    padding: clamp(14px, 3.5vw, 22px) 10px;
    font-size: clamp(24px, 6vw, 38px);
    font-weight: bold;
    border-radius: 18px;
    background: #fff;
    color: var(--ink);
    box-shadow: 0 6px 0 rgba(0,0,0,.12), 0 8px 16px rgba(0,0,0,.08);
    transition: transform .08s ease, background .15s ease, color .15s ease;
  }
  .answer:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.12); }
  .answer.correct { background: #22c55e; color: #fff; }
  .answer.wrong { background: #ef4444; color: #fff; animation: shake .4s ease; }
  .answer:disabled { cursor: default; }

  /* ---------- WORDS GAME ---------- */
  .word-hint {
    font-size: clamp(15px, 3.4vw, 22px);
    font-weight: bold;
    color: var(--muted);
    background: #fff;
    padding: 8px 20px;
    border-radius: 999px;
    box-shadow: 0 5px 12px rgba(0,0,0,.08);
    animation: qIn .3s ease;
  }
  .letter-prompt {
    font-size: clamp(96px, 26vw, 180px);
    font-weight: bold;
    line-height: .9;
    color: #7c3aed;
    text-shadow: 0 10px 0 rgba(124,58,237,.16);
    animation: popIn .3s ease;
  }
  @keyframes popIn {
    from { transform: scale(.7) rotate(-8deg); opacity: 0; }
    to   { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  .letter-answers .answer { color: #7c3aed; }
  .letter-answers .answer.correct { background: #22c55e; color: #fff; }
  .letter-answers .answer.wrong { background: #ef4444; color: #fff; }

  /* ---------- MEMORY GAME ---------- */
  #stage-memory { flex: 1; min-height: 0; padding-bottom: 4px; }
  .memory-board {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr));
    gap: clamp(4px, 1vw, 9px);
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    align-content: center;
    min-height: 0;
    padding: 2px 0 8px;
  }
  .mcard {
    position: relative;
    aspect-ratio: 1 / 1;
    background: none;
    padding: 0;
    border-radius: 14px;
    perspective: 600px;
    touch-action: manipulation;
  }
  .mcard-inner {
    position: absolute;
    inset: 0;
    transition: transform .32s ease;
    transform-style: preserve-3d;
  }
  .mcard.flipped .mcard-inner { transform: rotateY(180deg); }
  .mcard-face {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: inherit;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    box-shadow: 0 5px 12px rgba(0,0,0,.15);
    font-weight: bold;
  }
  .mcard-face.back {
    background: linear-gradient(150deg, #6366f1, #a855f7);
    color: #fff;
    font-size: clamp(18px, 3.4vw, 30px);
    box-shadow: inset 0 0 0 4px rgba(255,255,255,.25), 0 5px 12px rgba(0,0,0,.15);
  }
  .mcard-face.front {
    background: #fff;
    transform: rotateY(180deg);
    font-size: clamp(22px, 5.5vw, 44px);
  }
  .mcard.matched .mcard-face.front {
    background: #dcfce7;
    box-shadow: 0 0 0 3px #22c55e, 0 5px 12px rgba(0,0,0,.15);
  }
  .mcard.matched { animation: bounce .5s ease; }
  .mcard:active { transform: scale(.96); }

  /* ---------- SNAKE GAME ---------- */
  #stage-snake {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(6px, 1.6vh, 12px);
    padding: 2px 0 4px;
  }
  #stage-snake.hidden { display: none; }
  .snake-wrap {
    flex: 1;
    min-height: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .snake-canvas {
    display: block;
    width: auto;
    height: auto;
    max-width: min(100%, 520px);
    max-height: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 22px;
    border: 4px solid #86efac;
    background: #f0fdf4;
    box-shadow: 0 10px 24px rgba(22,101,52,.18), inset 0 0 0 4px rgba(255,255,255,.5);
    touch-action: none;
  }
  .snake-dpad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-areas:
      ". up ."
      "left down right";
    gap: clamp(5px, 1.4vw, 9px);
    width: min(200px, 58vw);
    flex-shrink: 0;
  }
  .snake-key {
    height: clamp(44px, 10.5vw, 54px);
    border-radius: 15px;
    background: #fff;
    color: #15803d;
    font-size: clamp(18px, 4.5vw, 24px);
    font-weight: bold;
    box-shadow: 0 5px 0 #bbf7d0, 0 7px 14px rgba(0,0,0,.12);
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
  }
  .snake-key:active { transform: translateY(3px); box-shadow: 0 2px 0 #bbf7d0; }
  .snake-key.up { grid-area: up; }
  .snake-key.left { grid-area: left; }
  .snake-key.down { grid-area: down; }
  .snake-key.right { grid-area: right; }

  /* ---------- FLAPPY BUTTERFLY GAME ---------- */
  #stage-butterfly {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(6px, 1.6vh, 12px);
    padding: 2px 0 4px;
  }
  #stage-butterfly.hidden { display: none; }
  .butterfly-wrap {
    flex: 1;
    min-height: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .butterfly-canvas {
    display: block;
    width: auto;
    height: auto;
    max-width: min(100%, 520px);
    max-height: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 22px;
    border: 4px solid #7dd3fc;
    background: #e0f2fe;
    box-shadow: 0 10px 24px rgba(3,105,161,.18), inset 0 0 0 4px rgba(255,255,255,.5);
    touch-action: none;
  }
  .butterfly-flap {
    flex-shrink: 0;
    width: min(300px, 72vw);
    height: clamp(48px, 12vw, 58px);
    border-radius: 999px;
    background: linear-gradient(135deg, #f472b6, #a78bfa);
    color: #fff;
    font-size: clamp(17px, 4vw, 22px);
    font-weight: bold;
    box-shadow: 0 6px 0 #7e22ce, 0 10px 18px rgba(0,0,0,.15);
  }
  .butterfly-flap:active { transform: translateY(4px); box-shadow: 0 2px 0 #7e22ce; }

  /* ---------- ROCK-PAPER-SCISSORS GAME ---------- */
  #stage-rps {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: clamp(8px, 2vh, 16px);
    padding: 2px 0 4px;
  }
  #stage-rps.hidden { display: none; }
  .rps-arena {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(84px, .8fr) minmax(0, 1fr);
    align-items: center;
    gap: clamp(4px, 1.6vw, 14px);
  }
  .rps-side {
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: clamp(8px, 2vw, 14px) 6px;
    border-radius: 20px;
    background: linear-gradient(160deg, #fff, #eff6ff);
    box-shadow: 0 6px 16px rgba(30,64,175,.12), inset 0 0 0 3px rgba(255,255,255,.7);
  }
  .rps-side.computer { background: linear-gradient(160deg, #fff, #fef2f2); }
  .rps-label { font-size: clamp(11px, 2.6vw, 15px); font-weight: bold; color: var(--muted); }
  .rps-hand {
    font-size: clamp(48px, 15vw, 90px);
    line-height: 1;
    min-height: 1em;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .rps-score { font-size: clamp(15px, 3.2vw, 20px); font-weight: bold; color: #1d4ed8; }
  .rps-side.computer .rps-score { color: #dc2626; }
  .rps-vs { text-align: center; min-width: 0; }
  .rps-result {
    min-height: 2.4em;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(13px, 3vw, 18px);
    font-weight: bold;
    line-height: 1.2;
    color: #334155;
  }
  .rps-result.win { color: #15803d; }
  .rps-result.lose { color: #dc2626; }
  .rps-result.tie { color: #b45309; }
  .rps-choices {
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: clamp(8px, 2vw, 16px);
  }
  .rps-choice {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-height: clamp(72px, 18vw, 96px);
    border-radius: 20px;
    font-weight: bold;
    color: #92400e;
    background: linear-gradient(160deg, #fff, #fef3c7);
    box-shadow: 0 6px 0 #fcd34d, 0 8px 16px rgba(0,0,0,.12);
    touch-action: manipulation;
  }
  .rps-choice .hand { font-size: clamp(30px, 9vw, 44px); line-height: 1; }
  .rps-choice .name { font-size: clamp(11px, 2.8vw, 15px); }
  .rps-choice.paper { color: #1e40af; background: linear-gradient(160deg, #fff, #dbeafe); box-shadow: 0 6px 0 #93c5fd, 0 8px 16px rgba(0,0,0,.12); }
  .rps-choice.scissors { color: #9d174d; background: linear-gradient(160deg, #fff, #fce7f3); box-shadow: 0 6px 0 #f9a8d4, 0 8px 16px rgba(0,0,0,.12); }
  .rps-choice.rock:active { transform: translateY(4px); box-shadow: 0 2px 0 #fcd34d; }
  .rps-choice.paper:active { transform: translateY(4px); box-shadow: 0 2px 0 #93c5fd; }
  .rps-choice.scissors:active { transform: translateY(4px); box-shadow: 0 2px 0 #f9a8d4; }
  .rps-hand.pop { animation: rpsPop .35s ease; }
  @keyframes rpsPop {
    0%   { transform: scale(.5) rotate(-12deg); opacity: .3; }
    70%  { transform: scale(1.12) rotate(4deg); opacity: 1; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }

  /* ---------- WHACK-A-MOLE GAME ---------- */
  #stage-mole {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2px 0 4px;
  }
  #stage-mole.hidden { display: none; }
  .mole-board {
    width: min(100%, 520px);
    aspect-ratio: 1 / 1;
    max-width: 100%;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-rows: repeat(3, minmax(0, 1fr));
    gap: clamp(6px, 2vw, 14px);
    padding: clamp(8px, 2vw, 16px);
    border: 4px solid #4ade80;
    border-radius: 28px;
    background: linear-gradient(160deg, #bbf7d0, #86efac);
    box-shadow: 0 10px 24px rgba(22,101,52,.18), inset 0 0 0 4px rgba(255,255,255,.5);
  }
  .mole-hole {
    position: relative;
    min-width: 0;
    min-height: 0;
    padding: 0;
    border: 0;
    border-radius: 50%;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 35%, #78350f 0%, #451a03 72%);
    box-shadow: inset 0 8px 14px rgba(0,0,0,.55), 0 3px 0 #a16207;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    touch-action: manipulation;
  }
  .mole-hole::before {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 7%;
    width: 78%;
    height: 22%;
    transform: translateX(-50%);
    border-radius: 50%;
    background: #92400e;
    box-shadow: 0 -2px 0 #b45309;
    z-index: 0;
  }
  .mole {
    position: relative;
    z-index: 1;
    margin-bottom: 9%;
    font-size: clamp(30px, 8vw, 58px);
    line-height: 1;
    transform: translateY(115%) scale(.82);
    opacity: 0;
    transition: transform .15s ease, opacity .12s ease;
    pointer-events: none;
    filter: drop-shadow(0 4px 3px rgba(0,0,0,.3));
  }
  .mole-hole.up .mole { transform: translateY(2%) scale(1); opacity: 1; }
  .mole-hole.up { box-shadow: inset 0 8px 14px rgba(0,0,0,.55), 0 0 0 4px #fde047, 0 3px 0 #a16207; }
  .mole-hole.bonk .mole { transform: translateY(30%) scale(1.15) rotate(-14deg); opacity: .35; }
  .mole-hole.bonk::after {
    content: "💥";
    position: absolute;
    left: 50%;
    top: 8%;
    transform: translateX(-50%);
    font-size: clamp(22px, 6vw, 38px);
    z-index: 2;
    animation: moleBonk .42s ease forwards;
  }
  .mole-hole.miss { animation: shake .35s ease; }
  @keyframes moleBonk {
    0%   { transform: translateX(-50%) scale(.4); opacity: 0; }
    60%  { transform: translateX(-50%) scale(1.15); opacity: 1; }
    100% { transform: translateX(-50%) scale(1) translateY(-8px); opacity: 0; }
  }

  /* ---------- EMOJI / FLASH ---------- */
  .feedback {
    position: fixed;
    left: 50%;
    top: 40%;
    transform: translate(-50%, -50%) scale(0);
    font-size: clamp(80px, 22vw, 170px);
    line-height: 1;
    pointer-events: none;
    z-index: 3500;
    opacity: 0;
  }
  .feedback.show-correct { animation: happyPop .9s ease; }
  .feedback.show-wrong   { animation: sadPop .9s ease; }
  @keyframes happyPop {
    0%   { transform: translate(-50%,-50%) scale(0) rotate(-30deg); opacity: 0; }
    30%  { transform: translate(-50%,-50%) scale(1.35) rotate(10deg); opacity: 1; }
    60%  { transform: translate(-50%,-50%) scale(1.05) rotate(-5deg); opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(1) rotate(0); opacity: 0; }
  }
  @keyframes sadPop {
    0%   { transform: translate(-50%,-50%) scale(0); opacity: 0; }
    30%  { transform: translate(-50%,-50%) scale(1.15); opacity: 1; }
    55%  { transform: translate(-50%,-50%) scale(1) translateX(-8px); opacity: 1; }
    70%  { transform: translate(-50%,-50%) scale(1) translateX(8px); opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(.9); opacity: 0; }
  }
  .flash {
    position: fixed; inset: 0; background: #fff;
    opacity: 0; pointer-events: none; z-index: 3400;
  }
  .flash.go { animation: flashAnim .55s ease; }
  @keyframes flashAnim {
    0% { opacity: 0; }
    20% { opacity: .8; }
    100% { opacity: 0; }
  }

  /* ---------- OVERLAY ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 3000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(15,23,42,.45);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .overlay.hidden { display: none; }
  .card {
    background: #fff;
    border-radius: 28px;
    padding: clamp(22px, 5vw, 40px);
    text-align: center;
    max-width: 440px;
    width: 100%;
    box-shadow: 0 24px 48px rgba(0,0,0,.3);
    animation: cardIn .3s ease;
  }
  @keyframes cardIn {
    from { transform: scale(.8); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }
  .card h2 { margin: 0 0 8px; font-size: clamp(22px, 5vw, 32px); }
  .stars-big {
    font-size: clamp(34px, 9vw, 54px);
    letter-spacing: 4px;
    margin: 6px 0 10px;
  }
  .card p { color: var(--muted); margin: 0 0 20px; font-size: clamp(14px, 3vw, 18px); }
  .card-buttons { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .fail-emoji { font-size: clamp(50px, 14vw, 80px); line-height: 1; margin-bottom: 6px; }

  #confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 4000; }
  .confetti-piece {
    position: absolute; top: -20px;
    width: 10px; height: 16px; border-radius: 3px;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity: .9; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- ===== WELCOME ===== -->
  <section id="screen-login" class="screen active">
    <div class="art">👋 🌈 🎮</div>
    <h1>Welcome!</h1>
    <p class="sub">What is your name?</p>
    <input id="player-name" class="name-input" type="text" maxlength="20" placeholder="Type your name" autocomplete="off" />
    <button id="btn-login" class="btn big">Start ▶</button>
  </section>

  <!-- ===== GAME SELECT ===== -->
  <section id="screen-games" class="screen">
    <div class="games-header">
      <h1>Choose a Game</h1>
      <p class="greeting" id="greeting"></p>
    </div>
    <div class="game-cards">
      <button class="game-card color-card" data-game="color">
        <div class="card-art">🔴 🟦 🔺 ⭐ ❤️</div>
        <div class="card-title">Color &amp; Shape Sorter</div>
        <div class="card-sub">Sort colorful shapes into the matching color bins</div>
        <div class="card-play">Play ▶</div>
      </button>
      <button class="game-card math-card" data-game="math">
        <div class="card-art">➕ ➖ ✖️ ➗</div>
        <div class="card-title">Play with Math</div>
        <div class="card-sub">Answer fun math questions and level up</div>
        <div class="card-play">Play ▶</div>
      </button>
      <button class="game-card word-card" data-game="words">
        <div class="card-art">🔤 Aa ✏️</div>
        <div class="card-title">Play with Words</div>
        <div class="card-sub">Learn the alphabet A to Z with big and little letters</div>
        <div class="card-play">Play ▶</div>
      </button>
      <button class="game-card memory-card" data-game="memory">
        <div class="card-art">🧠 🃏 ✨</div>
        <div class="card-title">MemoryLearnFun</div>
        <div class="card-sub">Flip cards and find the matching pairs</div>
        <div class="card-play">Play ▶</div>
      </button>
      <button class="game-card snake-card" data-game="snake">
        <div class="card-art">🐍 🍎</div>
        <div class="card-title">Snake</div>
        <div class="card-sub">Catch apples, grow longer, and avoid crashing</div>
        <div class="card-play">Play ▶</div>
      </button>
      <button class="game-card butterfly-card" data-game="butterfly">
        <div class="card-art">🦋 ☁️</div>
        <div class="card-title">Flappy Butterfly</div>
        <div class="card-sub">Tap to flutter and fly through the pipes</div>
        <div class="card-play">Play ▶</div>
      </button>
      <button class="game-card rps-card" data-game="rps">
        <div class="card-art">✊ ✋ ✌️</div>
        <div class="card-title">Rock-Paper-Scissors</div>
        <div class="card-sub">Play against the computer and win rounds</div>
        <div class="card-play">Play ▶</div>
      </button>
      <button class="game-card mole-card" data-game="mole">
        <div class="card-art">🔨 🐹</div>
        <div class="card-title">Whack-a-Mole</div>
        <div class="card-sub">Whack the moles before they duck back down</div>
        <div class="card-play">Play ▶</div>
      </button>
    </div>
    <button id="btn-change-name" class="link-btn">Not you? Change name</button>
  </section>

  <!-- ===== LEVEL SELECT ===== -->
  <section id="screen-levels" class="screen">
    <div class="topbar">
      <button class="btn icon" id="btn-levels-games" aria-label="Games">🎮</button>
      <h2 id="levels-title">Choose a Level</h2>
      <div class="spacer"></div>
    </div>
    <div class="levels-sub" id="levels-sub"></div>
    <div id="level-grid" class="level-grid"></div>
  </section>

  <!-- ===== GAME ===== -->
  <section id="screen-game" class="screen">
    <div class="game-top">
      <button class="btn icon" id="btn-game-back" aria-label="Back">⬅</button>
      <div class="game-info">
        <div class="level-name"><span id="game-title">Game</span> · Level <span id="game-level">1</span></div>
        <div class="progress-dots" id="progress-dots"></div>
      </div>
      <div class="game-counter"><span id="game-done">0</span>/<span id="game-total">3</span></div>
    </div>

    <div class="hearts" id="hearts"></div>
    <div class="task" id="task"></div>

    <div id="stage">
      <!-- Color & Shape -->
      <div id="stage-color" class="stage-view">
        <div class="tray" id="tray">
          <div class="shape-wrap" id="shape-wrap">
            <div class="shape-label" id="shape-label"><span class="dot"></span><span id="shape-name">Red Circle</span></div>
            <div class="shape-slot" id="shape-slot"></div>
          </div>
        </div>
        <div class="bins" id="bins"></div>
      </div>

      <!-- Math -->
      <div id="stage-math" class="stage-view hidden">
        <div class="question-card">
          <div class="question" id="question">7 + 5 = ?</div>
          <div class="answers" id="answers"></div>
        </div>
      </div>

      <!-- Play with Words -->
      <div id="stage-words" class="stage-view hidden">
        <div class="question-card">
          <div class="word-hint" id="word-hint">Apple 🍎</div>
          <div class="letter-prompt" id="letter-prompt">A</div>
          <div class="answers letter-answers" id="letter-answers"></div>
        </div>
      </div>

      <!-- MemoryLearnFun -->
      <div id="stage-memory" class="stage-view hidden">
        <div class="memory-board" id="memory-board"></div>
      </div>

      <!-- Snake -->
      <div id="stage-snake" class="stage-view hidden">
        <div class="snake-wrap">
          <canvas id="snake-canvas" class="snake-canvas" width="600" height="600" aria-label="Snake game board"></canvas>
        </div>
        <div class="snake-dpad" aria-label="Snake controls">
          <button class="snake-key up" data-dir="up" aria-label="Move up">▲</button>
          <button class="snake-key left" data-dir="left" aria-label="Move left">◀</button>
          <button class="snake-key down" data-dir="down" aria-label="Move down">▼</button>
          <button class="snake-key right" data-dir="right" aria-label="Move right">▶</button>
        </div>
      </div>

      <!-- Flappy Butterfly -->
      <div id="stage-butterfly" class="stage-view hidden">
        <div class="butterfly-wrap">
          <canvas id="butterfly-canvas" class="butterfly-canvas" width="600" height="600" aria-label="Flappy butterfly game board"></canvas>
        </div>
        <button id="butterfly-flap" class="butterfly-flap" aria-label="Flutter">Flutter! ⬆</button>
      </div>

      <!-- Rock-Paper-Scissors -->
      <div id="stage-rps" class="stage-view hidden">
        <div class="rps-arena">
          <div class="rps-side player">
            <div class="rps-label">You</div>
            <div class="rps-hand" id="rps-player-hand">❔</div>
            <div class="rps-score" id="rps-player-score">0</div>
          </div>
          <div class="rps-vs">
            <div class="rps-result" id="rps-result">Choose your hand!</div>
          </div>
          <div class="rps-side computer">
            <div class="rps-label">Computer</div>
            <div class="rps-hand" id="rps-cpu-hand">❔</div>
            <div class="rps-score" id="rps-cpu-score">0</div>
          </div>
        </div>
        <div class="rps-choices" aria-label="Rock paper scissors choices">
          <button class="rps-choice rock" data-hand="rock"><span class="hand">✊</span><span class="name">Rock</span></button>
          <button class="rps-choice paper" data-hand="paper"><span class="hand">✋</span><span class="name">Paper</span></button>
          <button class="rps-choice scissors" data-hand="scissors"><span class="hand">✌️</span><span class="name">Scissors</span></button>
        </div>
      </div>

      <!-- Whack-a-Mole -->
      <div id="stage-mole" class="stage-view hidden">
        <div id="mole-board" class="mole-board" aria-label="Whack-a-mole board"></div>
      </div>
    </div>
  </section>

  <!-- ===== LEVEL COMPLETE ===== -->
  <div id="overlay-complete" class="overlay hidden">
    <div class="card">
      <h2 id="complete-title">Level Complete!</h2>
      <div class="stars-big" id="complete-stars">⭐⭐⭐</div>
      <p id="complete-msg">Great job!</p>
      <div class="card-buttons">
        <button class="btn" id="btn-replay">🔄 Replay</button>
        <button class="btn primary" id="btn-next">Next Level ▶</button>
        <button class="btn" id="btn-levels">📋 Levels</button>
      </div>
    </div>
  </div>

  <!-- ===== LEVEL FAILED ===== -->
  <div id="overlay-fail" class="overlay hidden">
    <div class="card">
      <div class="fail-emoji">😢</div>
      <h2>Level Failed</h2>
      <p id="fail-msg">Too many wrong tries. Let's try again!</p>
      <div class="card-buttons">
        <button class="btn primary" id="btn-try-again">Try Again 🔄</button>
        <button class="btn" id="btn-fail-levels">📋 Levels</button>
      </div>
    </div>
  </div>

  <div id="feedback" class="feedback" aria-hidden="true"></div>
  <div id="flash" class="flash"></div>
  <div id="confetti"></div>
</div>

<script>
(function () {
  "use strict";

     DATA

    gray:   { hex: "#64748b", name: "Gray" },
    navy:   { hex: "#1e3a8a", name: "Navy" }
  };

  const SHAPES = {

    square:   { name: "Square",   svg: '<rect x="7" y="7" width="86" height="86" rx="12"/>' },

    oval:     { name: "Oval",     svg: '<ellipse cx="50" cy="50" rx="40" ry="47"/>' },
    pentagon: { name: "Pentagon", svg: '<polygon points="50,5 95,38 78,92 22,92 5,38"/>' },
    hexagon:  { name: "Hexagon",  svg: '<polygon points="50,4 90,27 90,73 50,96 10,73 10,27"/>' },
    cross:    { name: "Cross",    svg: '<path d="M38 6 H62 V38 H94 V62 H62 V94 H38 V62 H6 V38 H38 Z"/>' },
    octagon:  { name: "Octagon",  svg: '<polygon points="30,4 70,4 96,30 96,70 70,96 30,96 4,70 4,30"/>' },

    moon:     { name: "Moon",     svg: '<path d="M65 6 C30 14 12 30 12 50 C12 70 30 86 65 94 C45 78 38 64 38 50 C38 36 45 22 65 6 Z"/>' }

  const C8  = ["red","blue","yellow","green","orange","purple","pink","brown"];
  const C9  = C8.concat(["cyan"]);
  const C10 = C9.concat(["lime"]);
  const C11 = C10.concat(["gray"]);
  const C12 = C11.concat(["navy"]);

  const S10 = ["circle","square","triangle","star","heart","diamond","oval","pentagon","hexagon","cross"];
  const S11 = S10.concat(["octagon"]);
  const S12 = S11.concat(["trapezoid"]);
  const S13 = S12.concat(["arrow"]);
  const S14 = S13.concat(["moon"]);

  const COLOR_LEVELS = [
    { colors: ["red","blue"],                                           shapes: ["circle","square"],                                     rounds: 3  },

  function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function genAdd(max) {
    const a = randInt(1, max - 1);
    const b = randInt(1, max - a);
    return { text: a + " + " + b + " = ?", answer: a + b };
  }
  function genSub(max) {
    const a = randInt(2, max);
    const b = randInt(1, a);
    return { text: a + " − " + b + " = ?", answer: a - b };
  }
  function genMul(table) {
    const a = randInt(1, table);
    const b = randInt(1, 10);
    return { text: a + " × " + b + " = ?", answer: a * b };
  }
  function genDiv(table) {
    const b = randInt(1, table);
    const ans = randInt(1, 10);
    const a = b * ans;
    return { text: a + " ÷ " + b + " = ?", answer: ans };
  }

    if (pick === 0) return genAdd(50);

  function beep(freq, start, dur, type, vol) {
    const ctx = getAudio();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || "sine";
    osc.frequency.value = freq;
    const t = ctx.currentTime + start;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(vol || 0.18, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.05);
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = randInt(0, i);
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  function makeChoices(answer) {
    const set = [answer];
    const spread = Math.max(4, Math.ceil(Math.abs(answer) * 0.25));
    let guard = 0;
    while (set.length < 4 && guard < 300) {
      guard++;
      const delta = randInt(-spread, spread);
      if (delta === 0) continue;
      const v = answer + delta;
      if (v < 0) continue;
      if (set.indexOf(v) === -1) set.push(v);
    }
    let n = answer + 1;
    while (set.length < 4) {
      if (set.indexOf(n) === -1) set.push(n);
      n++;
    }
    return shuffle(set);
  }

    const p = progress[currentGameKey];
    game().levels.forEach(function (cfg, i) {
      const levelNo = i + 1;
      const unlocked = levelNo <= p.unlocked;
      const stars = p.stars[levelNo] || 0;

      const card = document.createElement("button");
      card.className = "level-card " + (unlocked ? "unlocked" : "locked");
      card.disabled = !unlocked;

      if (unlocked) {
        card.innerHTML =
          '<div class="num">' + levelNo + '</div>' +
          (cfg.name ? '<div class="lv-name">' + cfg.name + '</div>' : '') +
          '<div class="lv-stars">' + "⭐".repeat(stars) + "☆".repeat(3 - stars) + '</div>' +
          '<div class="lv-label">' + game().levelDesc(cfg) + '</div>';
        card.addEventListener("click", function () { getAudio(); startLevel(i); });
      } else {
        card.innerHTML =
          '<div class="lock">🔒</div>' +
          (cfg.name ? '<div class="lv-name">' + cfg.name + '</div>' : '') +
          '<div class="lv-label">Level ' + levelNo + '</div>';
      }
      levelGrid.appendChild(card);
    });
  }

  /* =======================================================================
     GAME FLOW
     ======================================================================= */

  function startLevel(index) {
    levelIndex = index;
    done = 0;
    mistakes = 0;
    busy = false;
    session++;
    stopSnake();
    stopButterflyGame();
    stopRps();
    stopMoleGame();
    currentColor = null;
    currentShape = null;
    currentMath = null;
    currentWord = null;
    lastWordIndex = -1;
    firstCard = null;
    lastCombo = "";
    lastMathText = "";
    snakeBody = [];
    snakeFood = null;

    const cfg = levelCfg();
    const total = currentGameKey === "memory" ? cfg.pairs
      : currentGameKey === "snake" ? cfg.target
      : currentGameKey === "butterfly" ? cfg.target
      : currentGameKey === "rps" ? cfg.target
      : currentGameKey === "mole" ? cfg.target
      : cfg.rounds;
    gameTitleEl.textContent = game().title;
    gameLevelEl.textContent = index + 1;
    gameDoneEl.textContent = "0";
    gameTotalEl.textContent = total;

    buildDots(total);
    renderHearts();

    stageColor.classList.toggle("hidden", currentGameKey !== "color");
    stageMath.classList.toggle("hidden", currentGameKey !== "math");
    stageWords.classList.toggle("hidden", currentGameKey !== "words");
    stageMemory.classList.toggle("hidden", currentGameKey !== "memory");
    stageSnake.classList.toggle("hidden", currentGameKey !== "snake");
    stageButterfly.classList.toggle("hidden", currentGameKey !== "butterfly");
    stageRps.classList.toggle("hidden", currentGameKey !== "rps");
    stageMole.classList.toggle("hidden", currentGameKey !== "mole");

    showScreen("game");
    if (currentGameKey === "memory") startMemoryLevel();
    else if (currentGameKey === "snake") startSnakeLevel();
    else if (currentGameKey === "butterfly") startButterflyLevel();
    else if (currentGameKey === "rps") startRpsLevel();
    else if (currentGameKey === "mole") startMoleLevel();
    else nextRound();
  }

  function nextRound() {
    if (done >= levelCfg().rounds) { completeLevel(); return; }
    if (currentGameKey === "color") startColorRound();
    else if (currentGameKey === "math") startMathRound();
    else startWordRound();
    updateDots();
    busy = false;
  }

  function buildDots(n) {
    dotsEl.innerHTML = "";
    for (let i = 0; i < n; i++) {
      const d = document.createElement("span");
      d.className = "dot-item";
      dotsEl.appendChild(d);
    }
  }
  function updateDots() {
    const items = dotsEl.children;
    for (let i = 0; i < items.length; i++) {
      items[i].classList.toggle("done", i < done);
    }
    gameDoneEl.textContent = done;
  }
  function renderHearts() {
    const max = maxWrong();
    const left = Math.max(0, max - mistakes);
    heartsEl.textContent = "❤️".repeat(left) + "🖤".repeat(max - left);
  }

  /* ---- shared result handling ---- */

  function resolveCorrect() {
    if (busy) return;
    busy = true;
    const s = session;
    soundCorrect();
    showEmoji(true);
    done++;
    updateDots();
    taskEl.textContent = "Great job! 🎉";
    setTimeout(function () {
      if (s !== session) return;
      if (done >= levelCfg().rounds) completeLevel();
      else nextRound();
    }, 750);
  }

  function resolveWrong() {
    if (busy) return;
    mistakes++;
    soundWrong();
    showEmoji(false);
    renderHearts();
    taskEl.textContent = "Oops! Try again. 🙂";
    const s = session;

    if (mistakes >= maxWrong()) {
      busy = true;
      setTimeout(function () {
        if (s !== session) return;
        failLevel();
      }, 800);
    } else {
      busy = true;
      setTimeout(function () {
        if (s !== session) return;
        busy = false;
        restoreTask();
      }, 700);
    }
  }

  function restoreTask() {
    if (currentGameKey === "color") restoreColorTask();
    else if (currentGameKey === "words") restoreWordTask();
    else if (currentGameKey === "memory") restoreMemoryTask();
    else if (currentGameKey === "snake") taskEl.textContent = "Catch the apples! 🍎";
    else if (currentGameKey === "butterfly") taskEl.textContent = "Tap Flutter to fly through the pipes! 🦋";
    else if (currentGameKey === "rps") taskEl.textContent = "Win " + levelCfg().target + " rounds! Choose your hand. ✊✋✌️";
    else if (currentGameKey === "mole") taskEl.textContent = "Whack " + levelCfg().target + " moles! Tap the mole when it pops up. 🐹";
    else taskEl.textContent = "Tap the correct answer!";
  }

  function completeLevel() {
    const levelNo = levelIndex + 1;
    const p = progress[currentGameKey];
    const stars = currentGameKey === "memory"
      ? (mistakes <= 1 ? 3 : mistakes <= 3 ? 2 : 1)
      : Math.max(1, 3 - mistakes);

    if (!p.stars[levelNo] || stars > p.stars[levelNo]) p.stars[levelNo] = stars;
    if (levelNo < game().levels.length) p.unlocked = Math.max(p.unlocked, levelNo + 1);

    completeTitle.textContent = "Level " + levelNo + " Complete!";
    completeStars.textContent = "⭐".repeat(stars) + "☆".repeat(3 - stars);
    completeMsg.textContent = currentGameKey === "snake"
      ? (stars === 3 ? "Perfect! You caught every apple! 🎉" :
         stars === 2 ? "Nice slithering! Keep going for 3 stars!" :
                       "Good job! Try again for more stars.")
      : currentGameKey === "butterfly"
      ? (stars === 3 ? "Perfect! You flew through every pipe! 🎉" :
         stars === 2 ? "Great flying! Keep going for 3 stars!" :
                       "Good job! Try again for more stars.")
      : currentGameKey === "rps"
      ? (stars === 3 ? "Perfect! You won every round without a loss! 🎉" :
         stars === 2 ? "Great playing! Keep going for 3 stars!" :
                       "Good job! Try again for more stars.")
      : currentGameKey === "mole"
      ? (stars === 3 ? "Perfect! You whacked every mole without a miss! 🎉" :
         stars === 2 ? "Great whacking! Keep going for 3 stars!" :
                       "Good job! Try again for more stars.")
      : (stars === 3 ? "Perfect! Everything correct! 🎉" :
         stars === 2 ? "Well done! Keep going for 3 stars!" :
                       "Good job! Try again for more stars.");

    if (levelNo < game().levels.length) {
      btnNext.textContent = "Next Level ▶";
      btnNext.dataset.action = "next";
    } else {
      btnNext.textContent = "Finish 🎊";
      btnNext.dataset.action = "finish";
    }

    overlay.classList.remove("hidden");
    soundWin();
    confetti();
    busy = true;
  }

  function failLevel() {
    soundFail();
    showEmoji(false);
    failMsgEl.textContent = (currentGameKey === "snake" || currentGameKey === "butterfly" || currentGameKey === "rps" || currentGameKey === "mole")
      ? "You lost all " + maxWrong() + " lives. Let's try this level again!"
      : "You made " + maxWrong() + " wrong tries. Let's try this level again!";
    overlayFail.classList.remove("hidden");
    busy = true;
  }

  /* =======================================================================
     COLOR GAME
     ======================================================================= */

  function makeShapeSvg(type, colorHex) {
    return '<svg viewBox="0 0 100 100" style="color:' + colorHex + '" fill="currentColor" ' +
           'stroke="rgba(255,255,255,.85)" stroke-width="3" stroke-linejoin="round">' +
           SHAPES[type].svg + '</svg>';
  }

  function startColorRound() {
    const cfg = levelCfg();
    let color, shape, combo, guard = 0;
    do {
      color = cfg.colors[randInt(0, cfg.colors.length - 1)];
      shape = cfg.shapes[randInt(0, cfg.shapes.length - 1)];
      combo = color + ":" + shape;
      guard++;
    } while (combo === lastCombo && guard < 20 && cfg.colors.length * cfg.shapes.length > 1);

    lastCombo = combo;
    currentColor = color;
    currentShape = shape;

    const ci = COLORS[color];
    const si = SHAPES[shape];
    shapeSlot.innerHTML = makeShapeSvg(shape, ci.hex);
    shapeName.textContent = ci.name + " " + si.name;
    labelDot.style.background = ci.hex;

    buildBins(cfg.colors);
    restoreColorTask();
  }

  function restoreColorTask() {
    if (!currentColor) return;
    const ci = COLORS[currentColor];
    const si = SHAPES[currentShape];
    taskEl.innerHTML =
      'Drag the <b>' + ci.name + " " + si.name + '</b> into the <b>' + ci.name + '</b> bin.';
  }

  function buildBins(colors) {
    binsEl.innerHTML = "";
    const minBin = colors.length > 10 ? 56 : colors.length > 8 ? 62 : 72;
    binsEl.style.gridTemplateColumns = "repeat(auto-fit, minmax(" + minBin + "px, 1fr))";
    colors.forEach(function (key) {
      const bin = document.createElement("div");
      bin.className = "bin";
      bin.dataset.color = key;
      bin.style.background = COLORS[key].hex;
      bin.setAttribute("role", "img");
      bin.setAttribute("aria-label", COLORS[key].name + " color bin");
      binsEl.appendChild(bin);
    });
  }

  /* ---- color drag & drop (bound once) ---- */

  let drag = null;

  shapeWrap.addEventListener("pointerdown", function (e) {
    if (busy || currentGameKey !== "color") return;
    getAudio();
    const rect = shapeWrap.getBoundingClientRect();
    drag = {
      offsetX: e.clientX - rect.left,
      offsetY: e.clientY - rect.top
    };
    shapeWrap.classList.add("dragging");
    shapeWrap.style.position = "fixed";
    shapeWrap.style.left = rect.left + "px";
    shapeWrap.style.top = rect.top + "px";
    shapeWrap.style.width = rect.width + "px";
    shapeWrap.style.height = rect.height + "px";
    shapeWrap.style.margin = "0";
    try { shapeWrap.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });

  shapeWrap.addEventListener("pointermove", function (e) {
    if (!drag) return;
    shapeWrap.style.left = (e.clientX - drag.offsetX) + "px";
    shapeWrap.style.top = (e.clientY - drag.offsetY) + "px";
    const r = shapeWrap.getBoundingClientRect();
    highlightBinAt(r.left + r.width / 2, r.top + r.height / 2);
  });

  shapeWrap.addEventListener("pointerup", function (e) {
    if (!drag) return;
    let bin = binAtShape();
    if (!bin) bin = binAt(e.clientX, e.clientY);
    clearHighlights();

    if (bin && !busy && currentColor) {
      if (bin.dataset.color === currentColor) {
        bin.classList.add("correct");
        setTimeout(function () { bin.classList.remove("correct"); }, 700);
        resolveCorrect();
      } else {
        bin.classList.add("wrong");
        setTimeout(function () { bin.classList.remove("wrong"); }, 700);
        resolveWrong();
      }
    }
    resetDrag();
  });

  shapeWrap.addEventListener("pointercancel", function () {
    clearHighlights();
    resetDrag();
  });

  function resetDrag() {
    drag = null;
    shapeWrap.classList.remove("dragging");
    shapeWrap.style.position = "";
    shapeWrap.style.left = "";
    shapeWrap.style.top = "";
    shapeWrap.style.width = "";
    shapeWrap.style.height = "";
    shapeWrap.style.margin = "";
  }

  function binAt(x, y) {
    const bins = binsEl.querySelectorAll(".bin");
    for (let i = 0; i < bins.length; i++) {
      const r = bins[i].getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return bins[i];
    }
    return null;
  }
  function binAtShape() {
    const r = shapeWrap.getBoundingClientRect();
    return binAt(r.left + r.width / 2, r.top + r.height / 2);
  }
  function highlightBinAt(x, y) {
    const target = binAt(x, y);
    const bins = binsEl.querySelectorAll(".bin");
    for (let i = 0; i < bins.length; i++) {
      bins[i].classList.toggle("hover", bins[i] === target);
    }
  }
  function clearHighlights() {
    const bins = binsEl.querySelectorAll(".bin");
    for (let i = 0; i < bins.length; i++) bins[i].classList.remove("hover");
  }

  /* =======================================================================
     MATH GAME
     ======================================================================= */

  function startMathRound() {
    const cfg = levelCfg();
    let q, guard = 0;
    do {
      q = cfg.gen();
      guard++;
    } while (q.text === lastMathText && guard < 15);

    lastMathText = q.text;
    currentMath = q;

    questionEl.textContent = q.text;
    questionEl.style.animation = "none";
    void questionEl.offsetWidth;
    questionEl.style.animation = "";

    answersEl.innerHTML = "";
    makeChoices(q.answer).forEach(function (val) {
      const b = document.createElement("button");
      b.className = "answer";
      b.textContent = val;
      b.dataset.value = val;
      b.addEventListener("click", function () { onAnswer(b, val); });
      answersEl.appendChild(b);
    });

    taskEl.textContent = "Tap the correct answer!";
  }

  function onAnswer(btn, val) {
    if (busy || btn.disabled || !currentMath) return;
    if (val === currentMath.answer) {
      btn.classList.add("correct");
      Array.prototype.forEach.call(answersEl.children, function (b) { b.disabled = true; });
      resolveCorrect();
    } else {
      btn.classList.add("wrong");
      btn.disabled = true;
      resolveWrong();
    }
  }

  /* =======================================================================
     WORDS GAME
     ======================================================================= */

  function pickLetterDistractors(targetIndex, count) {
    const near = [];
    for (let i = targetIndex - 3; i <= targetIndex + 3; i++) {
      if (i >= 0 && i < ALPHABET.length && i !== targetIndex) near.push(i);
    }
    shuffle(near);
    const rest = [];
    for (let i = 0; i < ALPHABET.length; i++) {
      if (i !== targetIndex && near.indexOf(i) === -1) rest.push(i);
    }
    shuffle(rest);
    const picks = near.slice(0, count);
    while (picks.length < count && rest.length) picks.push(rest.pop());
    return picks;
  }

  function startWordRound() {
    const askLower = done % 2 === 0;
    let targetIndex = randInt(0, ALPHABET.length - 1);
    let guard = 0;
    while (targetIndex === lastWordIndex && guard < 30) {
      targetIndex = randInt(0, ALPHABET.length - 1);
      guard++;
    }
    lastWordIndex = targetIndex;

    const entry = ALPHABET[targetIndex];
    currentWord = { entry: entry, askLower: askLower, index: targetIndex };

    letterPromptEl.textContent = askLower ? entry.upper : entry.lower;
    wordHintEl.textContent = entry.word + " " + entry.emoji;

    letterPromptEl.style.animation = "none";
    void letterPromptEl.offsetWidth;
    letterPromptEl.style.animation = "";
    wordHintEl.style.animation = "none";
    void wordHintEl.offsetWidth;
    wordHintEl.style.animation = "";

    const options = [targetIndex].concat(pickLetterDistractors(targetIndex, 3));
    shuffle(options);

    letterAnswersEl.innerHTML = "";
    options.forEach(function (idx) {
      const b = document.createElement("button");
      b.className = "answer";
      b.textContent = askLower ? ALPHABET[idx].lower : ALPHABET[idx].upper;
      b.dataset.index = idx;
      b.addEventListener("click", function () { onLetterAnswer(b, idx); });
      letterAnswersEl.appendChild(b);
    });

    restoreWordTask();
  }

  function restoreWordTask() {
    if (!currentWord) return;
    taskEl.textContent = currentWord.askLower ? "Tap the little letter!" : "Tap the big letter!";
  }

  function onLetterAnswer(btn, idx) {
    if (busy || btn.disabled || !currentWord) return;
    if (idx === currentWord.index) {
      btn.classList.add("correct");
      Array.prototype.forEach.call(letterAnswersEl.children, function (b) { b.disabled = true; });
      resolveCorrect();
    } else {
      btn.classList.add("wrong");
      btn.disabled = true;
      resolveWrong();
    }
  }

  /* =======================================================================
     MEMORY GAME
     ======================================================================= */

  function startMemoryLevel() {
    const cfg = levelCfg();
    firstCard = null;
    taskEl.textContent = "Flip two cards to find a matching pair! 🧠";
    buildMemoryBoard(cfg);
  }

  function buildMemoryBoard(cfg) {
    const picks = shuffle(MEMORY_SYMBOLS.slice()).slice(0, cfg.pairs);
    const deck = [];
    picks.forEach(function (symbol) {
      deck.push(symbol);
      deck.push(symbol);
    });
    shuffle(deck);

    memoryBoard.style.setProperty("--cols", cfg.cols || 4);
    memoryBoard.innerHTML = "";
    deck.forEach(function (symbol) {
      const card = document.createElement("button");
      card.className = "mcard";
      card.dataset.symbol = symbol;
      card.setAttribute("aria-label", "Hidden memory card");
      card.innerHTML =
        '<div class="mcard-inner">' +
          '<div class="mcard-face back">?</div>' +
          '<div class="mcard-face front">' + symbol + '</div>' +
        '</div>';
      card.addEventListener("click", function () { onMemoryCard(card); });
      memoryBoard.appendChild(card);
    });
    sizeMemoryBoard();
  }

  function sizeMemoryBoard() {
    if (currentGameKey !== "memory") return;
    const cfg = levelCfg();
    if (!cfg || !cfg.pairs) return;
    const cols = cfg.cols || 4;
    const rows = Math.ceil((cfg.pairs * 2) / cols);
    const stageH = stageMemory.clientHeight;
    if (!stageH) return;
    const availH = Math.max(180, stageH - 20);
    const gap = 9;
    const cardH = (availH - (rows - 1) * gap) / rows;
    const card = Math.max(40, Math.min(120, cardH));
    const width = Math.min(560, cols * card + (cols - 1) * gap);
    memoryBoard.style.maxWidth = Math.round(width) + "px";
  }

  function onMemoryCard(card) {
    if (busy || currentGameKey !== "memory" || !card) return;
    if (card.classList.contains("flipped") || card.classList.contains("matched")) return;
    getAudio();
    card.classList.add("flipped");

    if (!firstCard) {
      firstCard = card;
      taskEl.textContent = "Now find its match! 🧠";
      return;
    }

    const second = card;
    if (firstCard.dataset.symbol === second.dataset.symbol) {
      handleMemoryMatch(firstCard, second);
    } else {
      handleMemoryMismatch(firstCard, second);
    }
  }

  function handleMemoryMatch(a, b) {
    firstCard = null;
    a.classList.add("matched");
    b.classList.add("matched");
    done++;
    updateDots();
    soundCorrect();
    showEmoji(true);
    taskEl.textContent = "Match! 🎉";

    const s = session;
    busy = true;
    if (done >= levelCfg().pairs) {
      setTimeout(function () {
        if (s !== session) return;
        completeLevel();
      }, 700);
    } else {
      setTimeout(function () {
        if (s !== session) return;
        busy = false;
        restoreMemoryTask();
      }, 550);
    }
  }

  function handleMemoryMismatch(a, b) {
    firstCard = null;
    mistakes++;
    soundWrong();
    showEmoji(false);
    renderHearts();
    taskEl.textContent = "Not a match. Try again! 🙂";

    const s = session;
    busy = true;
    setTimeout(function () {
      if (s !== session) return;
      a.classList.remove("flipped");
      b.classList.remove("flipped");
      if (mistakes >= maxWrong()) {
        failLevel();
      } else {
        busy = false;
        restoreMemoryTask();
      }
    }, 900);
  }

  function restoreMemoryTask() {
    if (currentGameKey !== "memory") return;
    taskEl.textContent = "Flip two cards to find a matching pair! 🧠";
  }

  /* =======================================================================
     SNAKE GAME
     ======================================================================= */

  function stopSnake() {
    if (snakeInterval) { clearInterval(snakeInterval); snakeInterval = null; }
    if (snakeStartTimeout) { clearTimeout(snakeStartTimeout); snakeStartTimeout = null; }
    snakePaused = false;
  }

  function resetSnakeBody() {
    const cy = Math.floor(SNAKE_GRID / 2);
    snakeBody = [
      { x: 4, y: cy },
      { x: 3, y: cy },
      { x: 2, y: cy }
    ];
    snakeDir = { x: 1, y: 0 };
    snakeNextDir = { x: 1, y: 0 };
    if (snakeFood && snakeBody.some(function (s) { return s.x === snakeFood.x && s.y === snakeFood.y; })) {
      placeSnakeFood();
    }
  }

  function placeSnakeFood() {
    const free = [];
    for (let x = 0; x < SNAKE_GRID; x++) {
      for (let y = 0; y < SNAKE_GRID; y++) {
        let taken = false;
        for (let i = 0; i < snakeBody.length; i++) {
          if (snakeBody[i].x === x && snakeBody[i].y === y) { taken = true; break; }
        }
        if (!taken) free.push({ x: x, y: y });
      }
    }
    snakeFood = free.length ? free[randInt(0, free.length - 1)] : null;
  }

  function scheduleSnakeStart(delay) {
    stopSnake();
    snakePaused = true;
    const s = session;
    snakeStartTimeout = setTimeout(function () {
      snakeStartTimeout = null;
      if (s !== session || currentGameKey !== "snake" || busy) return;
      snakePaused = false;
      snakeInterval = setInterval(function () {
        if (s !== session || currentGameKey !== "snake") { stopSnake(); return; }
        snakeTick();
      }, levelCfg().speed);
    }, delay);
  }

  function startSnakeLevel() {
    stopSnake();
    snakeBody = [];
    snakeFood = null;
    resetSnakeBody();
    placeSnakeFood();
    taskEl.textContent = "Catch the apples! 🍎";
    drawSnake();
    scheduleSnakeStart(700);
  }

  function setSnakeDirection(dx, dy) {
    if (currentGameKey !== "snake") return;
    if (dx === -snakeDir.x && dy === -snakeDir.y) return;
    if (dx === snakeDir.x && dy === snakeDir.y) return;
    snakeNextDir = { x: dx, y: dy };
  }

  function snakeTick() {
    if (snakePaused || busy || currentGameKey !== "snake" || !snakeBody.length) return;

    if (snakeNextDir.x === -snakeDir.x && snakeNextDir.y === -snakeDir.y) {
      snakeNextDir = { x: snakeDir.x, y: snakeDir.y };
    } else {
      snakeDir = { x: snakeNextDir.x, y: snakeNextDir.y };
    }

    const head = snakeBody[0];
    const nx = head.x + snakeDir.x;
    const ny = head.y + snakeDir.y;
    const willGrow = snakeFood && nx === snakeFood.x && ny === snakeFood.y;
    const body = willGrow ? snakeBody : snakeBody.slice(0, -1);
    let hit = nx < 0 || nx >= SNAKE_GRID || ny < 0 || ny >= SNAKE_GRID;

    if (!hit) {
      for (let i = 0; i < body.length; i++) {
        if (body[i].x === nx && body[i].y === ny) { hit = true; break; }
      }
    }
    if (hit) { snakeCrash(); return; }

    snakeBody.unshift({ x: nx, y: ny });
    if (willGrow) {
      done++;
      updateDots();
      beep(880, 0, 0.09, "triangle", 0.16);
      if (done >= levelCfg().target) {
        stopSnake();
        drawSnake();
        taskEl.textContent = "You caught all the apples! 🎉";
        busy = true;
        const s = session;
        setTimeout(function () {
          if (s !== session) return;
          completeLevel();
        }, 750);
        return;
      }
      placeSnakeFood();
      taskEl.textContent = "Yum! " + done + " / " + levelCfg().target + " apples 🍎";
    } else {
      snakeBody.pop();
    }
    drawSnake();
  }

  function snakeCrash() {
    stopSnake();
    mistakes++;
    renderHearts();
    soundWrong();
    showEmoji(false);
    drawSnake();

    if (mistakes >= maxWrong()) {
      taskEl.textContent = "No more lives! 😢";
      busy = true;
      const s = session;
      setTimeout(function () {
        if (s !== session) return;
        failLevel();
      }, 600);
      return;
    }

    taskEl.textContent = "Oops! " + (maxWrong() - mistakes) + " lives left. Watch the walls! 🐍";
    resetSnakeBody();
    drawSnake();
    scheduleSnakeStart(900);
  }

  function roundSnakeRect(ctx, x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function drawSnakeFood(ctx, cell) {
    if (!snakeFood) return;
    const cx = snakeFood.x * cell + cell / 2;
    const cy = snakeFood.y * cell + cell / 2;
    const r = cell * 0.3;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.fillStyle = "#ef4444";
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#b91c1c";
    ctx.lineWidth = cell * 0.045;
    ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,.45)";
    ctx.beginPath();
    ctx.arc(-r * 0.32, -r * 0.32, r * 0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#92400e";
    ctx.lineWidth = cell * 0.045;
    ctx.beginPath();
    ctx.moveTo(0, -r * 0.6);
    ctx.lineTo(0, -r * 1.1);
    ctx.stroke();
    ctx.fillStyle = "#65a30d";
    ctx.beginPath();
    ctx.ellipse(r * 0.4, -r * 0.95, r * 0.42, r * 0.2, -0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawSnakeEyes(ctx, head, cell) {
    const hx = head.x * cell + cell / 2;
    const hy = head.y * cell + cell / 2;
    const ex = snakeDir.x;
    const ey = snakeDir.y;
    const px = -ey;
    const py = ex;
    const forward = cell * 0.16;
    const side = cell * 0.18;
    const r = cell * 0.1;

    for (let i = -1; i <= 1; i += 2) {
      const x = hx + ex * forward + px * side * i;
      const y = hy + ey * forward + py * side * i;
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#0f172a";
      ctx.beginPath();
      ctx.arc(x + ex * r * 0.35, y + ey * r * 0.35, r * 0.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawSnake() {
    if (!snakeCtx) return;
    const size = snakeCanvas.width;
    const cell = size / SNAKE_GRID;

    snakeCtx.clearRect(0, 0, size, size);
    snakeCtx.fillStyle = "#f0fdf4";
    snakeCtx.fillRect(0, 0, size, size);

    snakeCtx.strokeStyle = "rgba(34,197,94,.12)";
    snakeCtx.lineWidth = 1;
    for (let i = 1; i < SNAKE_GRID; i++) {
      const p = i * cell;
      snakeCtx.beginPath();
      snakeCtx.moveTo(p + 0.5, 0);
      snakeCtx.lineTo(p + 0.5, size);
      snakeCtx.stroke();
      snakeCtx.beginPath();
      snakeCtx.moveTo(0, p + 0.5);
      snakeCtx.lineTo(size, p + 0.5);
      snakeCtx.stroke();
    }

    drawSnakeFood(snakeCtx, cell);

    for (let i = snakeBody.length - 1; i >= 0; i--) {
      const seg = snakeBody[i];
      const pad = cell * 0.08;
      snakeCtx.fillStyle = i === 0 ? "#15803d" : (i % 2 ? "#22c55e" : "#4ade80");
      roundSnakeRect(snakeCtx, seg.x * cell + pad, seg.y * cell + pad, cell - pad * 2, cell - pad * 2, cell * 0.28);
      snakeCtx.fill();
    }

    if (snakeBody.length) drawSnakeEyes(snakeCtx, snakeBody[0], cell);
  }

  /* =======================================================================
     FLAPPY BUTTERFLY GAME
     ======================================================================= */

  function stopButterflyGame() {
    butterflyRunning = false;
    if (butterflyAnimationId) {
      cancelAnimationFrame(butterflyAnimationId);
      butterflyAnimationId = null;
    }
    butterflyLastTs = 0;
  }

  function newButterflyPipe(x) {
    const gap = levelCfg().gap;
    const margin = 70;
    const min = Math.round(margin + gap / 2);
    const max = Math.round(BUTTERFLY_GROUND - margin - gap / 2);
    return { x: x, gapY: randInt(min, max), passed: false };
  }

  function resetButterflyRun() {
    butterflyY = 300;
    butterflyVy = 0;
    butterflyRotation = 0;
    butterflyStarted = false;
    butterflyPipes = [newButterflyPipe(520)];
    drawButterfly();
  }

  function startButterflyLevel() {
    stopButterflyGame();
    resetButterflyRun();
    taskEl.textContent = "Tap Flutter to fly through the pipes! 🦋";
    drawButterfly();
    butterflyRunning = true;
    butterflyLastTs = 0;
    butterflyAnimationId = requestAnimationFrame(butterflyLoop);
  }

  function butterflyLoop(ts) {
    if (!butterflyRunning || currentGameKey !== "butterfly") {
      butterflyRunning = false;
      butterflyAnimationId = null;
      return;
    }
    if (!butterflyLastTs) butterflyLastTs = ts;
    const dt = Math.min(0.033, Math.max(0, (ts - butterflyLastTs) / 1000));
    butterflyLastTs = ts;
    if (butterflyStarted && !busy) updateButterfly(dt);
    drawButterfly();
    if (!butterflyRunning) return;
    butterflyAnimationId = requestAnimationFrame(butterflyLoop);
  }

  function flapButterfly() {
    if (currentGameKey !== "butterfly" || busy) return;
    getAudio();
    if (!butterflyStarted) {
      butterflyStarted = true;
      taskEl.textContent = "Keep fluttering! Tap Flutter to go up. 🦋";
    }
    butterflyVy = BUTTERFLY_FLAP;
    beep(660, 0, 0.06, "triangle", 0.12);
  }

  function updateButterfly(dt) {
    const cfg = levelCfg();
    butterflyVy += BUTTERFLY_GRAVITY * dt;
    butterflyY += butterflyVy * dt;
    butterflyRotation = Math.max(-0.5, Math.min(1, butterflyVy / 900));

    for (let i = 0; i < butterflyPipes.length; i++) {
      butterflyPipes[i].x -= cfg.speed * dt;
    }

    const last = butterflyPipes[butterflyPipes.length - 1];
    if (!last) butterflyPipes.push(newButterflyPipe(520));
    else if (last.x <= 600 - cfg.spacing) butterflyPipes.push(newButterflyPipe(last.x + cfg.spacing));
    butterflyPipes = butterflyPipes.filter(function (p) { return p.x + BUTTERFLY_PIPE_W > -30; });

    if (butterflyY - BUTTERFLY_RADIUS < 0 || butterflyY + BUTTERFLY_RADIUS > BUTTERFLY_GROUND) {
      butterflyCrash();
      return;
    }

    for (let i = 0; i < butterflyPipes.length; i++) {
      const p = butterflyPipes[i];
      const top = p.gapY - cfg.gap / 2;
      const bottom = p.gapY + cfg.gap / 2;
      const overlapsX = BUTTERFLY_X + BUTTERFLY_RADIUS > p.x && BUTTERFLY_X - BUTTERFLY_RADIUS < p.x + BUTTERFLY_PIPE_W;
      if (overlapsX && (butterflyY - BUTTERFLY_RADIUS < top || butterflyY + BUTTERFLY_RADIUS > bottom)) {
        butterflyCrash();
        return;
      }
    }

    let scored = false;
    for (let i = 0; i < butterflyPipes.length; i++) {
      const p = butterflyPipes[i];
      if (!p.passed && p.x + BUTTERFLY_PIPE_W < BUTTERFLY_X - BUTTERFLY_RADIUS) {
        p.passed = true;
        done++;
        scored = true;
      }
    }

    if (scored) {
      updateDots();
      beep(1046, 0, 0.08, "triangle", 0.15);
      if (done >= cfg.target) {
        stopButterflyGame();
        drawButterfly();
        taskEl.textContent = "You flew through all the pipes! 🎉";
        busy = true;
        const s = session;
        setTimeout(function () {
          if (s !== session) return;
          completeLevel();
        }, 750);
        return;
      }
      taskEl.textContent = "Pipe " + done + " / " + cfg.target + "! Keep flying! 🐦";
    }
  }

  function butterflyCrash() {
    mistakes++;
    renderHearts();
    soundWrong();
    showEmoji(false);

    if (mistakes >= maxWrong()) {
      stopButterflyGame();
      taskEl.textContent = "No more lives! 😢";
      busy = true;
      const s = session;
      setTimeout(function () {
        if (s !== session) return;
        failLevel();
      }, 600);
      return;
    }

    taskEl.textContent = "Oops! " + (maxWrong() - mistakes) + " lives left. Tap Flutter to try again! 🦋";
    resetButterflyRun();
  }

  function drawButterflyCloud(ctx, x, y, scale) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.fillStyle = "rgba(255,255,255,.85)";
    ctx.beginPath();
    ctx.arc(0, 0, 26, 0, Math.PI * 2);
    ctx.arc(30, 6, 20, 0, Math.PI * 2);
    ctx.arc(-26, 8, 18, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawButterfly() {
    if (!butterflyCtx) return;
    const w = butterflyCanvas.width;
    const h = butterflyCanvas.height;
    const ctx = butterflyCtx;
    const now = performance.now() / 1000;
    const gap = levelCfg().gap;

    const sky = ctx.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, "#bae6fd");
    sky.addColorStop(1, "#e0f2fe");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, w, h);

    ctx.fillStyle = "rgba(253,224,71,.9)";
    ctx.beginPath();
    ctx.arc(500, 90, 46, 0, Math.PI * 2);
    ctx.fill();

    drawButterflyCloud(ctx, 80 + (now * 10) % 700, 110, 1);
    drawButterflyCloud(ctx, 300 + (now * 7) % 760, 180, 0.75);
    drawButterflyCloud(ctx, 520 + (now * 5) % 800, 70, 0.6);

    for (let i = 0; i < butterflyPipes.length; i++) {
      const p = butterflyPipes[i];
      const top = p.gapY - gap / 2;
      const bottom = p.gapY + gap / 2;

      ctx.fillStyle = "#22c55e";
      ctx.fillRect(p.x, 0, BUTTERFLY_PIPE_W, top);
      ctx.fillRect(p.x, bottom, BUTTERFLY_PIPE_W, BUTTERFLY_GROUND - bottom);
      ctx.fillStyle = "#16a34a";
      ctx.fillRect(p.x - 6, top - 26, BUTTERFLY_PIPE_W + 12, 26);
      ctx.fillRect(p.x - 6, bottom, BUTTERFLY_PIPE_W + 12, 26);
      ctx.strokeStyle = "#15803d";
      ctx.lineWidth = 3;
      ctx.strokeRect(p.x - 6, top - 26, BUTTERFLY_PIPE_W + 12, 26);
      ctx.strokeRect(p.x - 6, bottom, BUTTERFLY_PIPE_W + 12, 26);
    }

    ctx.fillStyle = "#86efac";
    ctx.fillRect(0, BUTTERFLY_GROUND, w, h - BUTTERFLY_GROUND);
    ctx.fillStyle = "#4ade80";
    ctx.fillRect(0, BUTTERFLY_GROUND, w, 8);
    ctx.fillStyle = "#15803d";
    for (let x = 10; x < w; x += 32) {
      ctx.beginPath();
      ctx.moveTo(x, BUTTERFLY_GROUND);
      ctx.lineTo(x + 6, BUTTERFLY_GROUND - 10);
      ctx.lineTo(x + 12, BUTTERFLY_GROUND);
      ctx.fill();
    }

    const bob = butterflyStarted ? 0 : Math.sin(performance.now() / 220) * 5;
    const flutter = Math.sin(performance.now() / (butterflyStarted ? 90 : 240));
    const spread = 0.72 + 0.28 * Math.abs(flutter);
    ctx.save();
    ctx.translate(BUTTERFLY_X, butterflyY + bob);
    ctx.rotate(butterflyRotation);

    ctx.save();
    ctx.scale(spread, 1);

    ctx.fillStyle = "#f9a8d4";
    ctx.beginPath();
    ctx.moveTo(-3, -7);
    ctx.bezierCurveTo(-10, -34, -38, -38, -36, -14);
    ctx.bezierCurveTo(-35, 0, -17, 4, -4, -2);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = "rgba(124,58,237,.55)";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = "#c4b5fd";
    ctx.beginPath();
    ctx.moveTo(3, -7);
    ctx.bezierCurveTo(10, -34, 38, -38, 36, -14);
    ctx.bezierCurveTo(35, 0, 17, 4, 4, -2);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#fbbf24";
    ctx.beginPath();
    ctx.moveTo(-4, 2);
    ctx.bezierCurveTo(-26, 2, -36, 28, -20, 32);
    ctx.bezierCurveTo(-10, 34, -3, 18, -3, 8);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#67e8f9";
    ctx.beginPath();
    ctx.moveTo(4, 2);
    ctx.bezierCurveTo(26, 2, 36, 28, 20, 32);
    ctx.bezierCurveTo(10, 34, 3, 18, 3, 8);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "rgba(255,255,255,.9)";
    ctx.beginPath();
    ctx.arc(-20, -20, 4.5, 0, Math.PI * 2);
    ctx.arc(20, -20, 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(-27, -11, 3, 0, Math.PI * 2);
    ctx.arc(27, -11, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(-20, 21, 3, 0, Math.PI * 2);
    ctx.arc(20, 21, 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    ctx.fillStyle = "#4c1d95";
    ctx.beginPath();
    ctx.ellipse(0, 2, 8, 21, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#312e81";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.strokeStyle = "rgba(196,181,253,.65)";
    ctx.lineWidth = 1.5;
    for (let seg = -8; seg <= 8; seg += 8) {
      ctx.beginPath();
      ctx.moveTo(-6, seg);
      ctx.quadraticCurveTo(0, seg + 3, 6, seg);
      ctx.stroke();
    }

    ctx.fillStyle = "#4c1d95";
    ctx.beginPath();
    ctx.arc(0, -21, 7.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(-3, -22, 2.4, 0, Math.PI * 2);
    ctx.arc(3, -22, 2.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#0f172a";
    ctx.beginPath();
    ctx.arc(-2.8, -22, 1.1, 0, Math.PI * 2);
    ctx.arc(3.2, -22, 1.1, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "#4c1d95";
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(-3, -26);
    ctx.quadraticCurveTo(-12, -36, -16, -39);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(3, -26);
    ctx.quadraticCurveTo(12, -36, 16, -39);
    ctx.stroke();
    ctx.fillStyle = "#7c3aed";
    ctx.beginPath();
    ctx.arc(-16, -39, 2, 0, Math.PI * 2);
    ctx.arc(16, -39, 2, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

     ROCK-PAPER-SCISSORS GAME
