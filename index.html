<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Kids Games</title>
<style>
  :root {
    --ink: #334155;
    --muted: #64748b;
    --shape-size: clamp(96px, 20vw, 140px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    color: var(--ink);
    background: linear-gradient(160deg, #fdf2f8 0%, #e0f2fe 45%, #dcfce7 100%);
  }
  button { font-family: inherit; cursor: pointer; border: none; }

  .screen {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    padding: 16px;
  }
  .screen.active { display: flex; }

  /* ---------- LOGIN ---------- */
  #screen-login {
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 6px;
  }
  .art {
    font-size: clamp(30px, 8vw, 56px);
    letter-spacing: 6px;
    margin-bottom: 8px;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-10px); }
  }
  h1 { margin: 0; font-size: clamp(26px, 6vw, 46px); letter-spacing: 1px; }
  .sub {
    color: var(--muted);
    font-size: clamp(14px, 3vw, 20px);
    margin: 6px 0 18px;
  }
  .greeting {
    margin: 6px 0 0;
    font-size: clamp(15px, 3.4vw, 22px);
    font-weight: bold;
    color: #0ea5e9;
  }
  .btn {
    padding: 14px 26px;
    border-radius: 16px;
    font-size: clamp(15px, 3vw, 20px);
    font-weight: bold;
    background: #fff;
    color: var(--ink);
    box-shadow: 0 6px 0 rgba(0,0,0,.12), 0 8px 16px rgba(0,0,0,.08);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.12); }
  .btn.primary { background: linear-gradient(135deg, #38bdf8, #6366f1); color: #fff; }
  .btn.big {
    padding: 18px 60px;
    font-size: clamp(20px, 4.5vw, 30px);
    border-radius: 22px;
    background: linear-gradient(135deg, #34d399, #22c55e);
    color: #fff;
    box-shadow: 0 8px 0 #15803d, 0 14px 22px rgba(0,0,0,.15);
  }
  .btn.big:active { transform: translateY(5px); box-shadow: 0 3px 0 #15803d; }
  .link-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 14px;
    text-decoration: underline;
    margin-top: 14px;
    padding: 6px;
  }
  .name-input {
    width: min(340px, 82vw);
    padding: 15px 18px;
    font-size: clamp(18px, 4vw, 24px);
    text-align: center;
    font-family: inherit;
    color: var(--ink);
    background: #fff;
    border: 3px solid #cbd5e1;
    border-radius: 16px;
    outline: none;
    box-shadow: 0 6px 14px rgba(0,0,0,.08);
    margin-bottom: 14px;
  }
  .name-input:focus { border-color: #38bdf8; box-shadow: 0 0 0 4px rgba(56,189,248,.25); }
  .name-input.shake { animation: shake .4s ease; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25%     { transform: translateX(-10px); }
    50%     { transform: translateX(10px); }
    75%     { transform: translateX(-6px); }
  }

  /* ---------- GAME SELECT ---------- */
  #screen-games {
    align-items: center;
    justify-content: flex-start;
    text-align: center;
    padding-top: clamp(20px, 5vh, 56px);
  }
  .games-header { margin-bottom: 18px; }
  .game-cards {
    display: flex;
    flex-direction: column;
    gap: 18px;
    width: 100%;
    max-width: 560px;
  }
  .game-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 22px 20px;
    border-radius: 26px;
    background: #fff;
    box-shadow: 0 10px 24px rgba(0,0,0,.12), inset 0 0 0 4px rgba(255,255,255,.6);
    transition: transform .12s ease;
    color: var(--ink);
  }
  .game-card:active { transform: scale(.97); }
  .game-card.color-card { background: linear-gradient(160deg, #fff1f2, #e0f2fe); }
  .game-card.math-card  { background: linear-gradient(160deg, #fefce8, #dcfce7); }
  .card-art { font-size: clamp(26px, 6vw, 40px); letter-spacing: 5px; }
  .card-title { font-size: clamp(20px, 4.5vw, 28px); font-weight: bold; }
  .card-sub { font-size: clamp(12px, 2.8vw, 16px); color: var(--muted); margin-bottom: 6px; }
  .card-play {
    margin-top: 4px;
    padding: 10px 30px;
    border-radius: 999px;
    font-weight: bold;
    font-size: clamp(14px, 3vw, 18px);
    color: #fff;
    background: linear-gradient(135deg, #38bdf8, #6366f1);
    box-shadow: 0 5px 0 #4338ca;
  }
  .math-card .card-play { background: linear-gradient(135deg, #f59e0b, #f97316); box-shadow: 0 5px 0 #b45309; }

  /* ---------- TOPBAR / LEVELS ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    max-width: 860px;
    margin: 0 auto 8px;
  }
  .topbar h2 { margin: 0; font-size: clamp(18px, 4vw, 28px); }
  .btn.icon {
    width: 52px; height: 52px; padding: 0; border-radius: 14px;
    font-size: 22px; display: flex; align-items: center; justify-content: center;
  }
  .spacer { width: 52px; }
  .levels-sub {
    text-align: center;
    color: var(--muted);
    font-size: clamp(13px, 2.8vw, 16px);
    margin: 0 auto 10px;
  }
  .level-grid {
    width: 100%;
    max-width: 860px;
    margin: 0 auto;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 14px;
    padding: 6px 2px 24px;
  }
  .level-card {
    position: relative;
    min-height: 122px;
    border-radius: 20px;
    background: linear-gradient(160deg, #ffffff, #eef2ff);
    box-shadow: 0 6px 14px rgba(0,0,0,.1);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    color: var(--ink);
    transition: transform .12s ease;
    padding: 12px;
    text-align: center;
  }
  .level-card.unlocked:active { transform: scale(.96); }
  .level-card .num {
    font-size: clamp(24px, 5vw, 34px);
    font-weight: bold;
    color: #6366f1;
    line-height: 1;
  }
  .level-card .lv-name { font-size: clamp(13px, 2.6vw, 15px); font-weight: bold; }
  .level-card .lv-stars { font-size: 15px; letter-spacing: 2px; }
  .level-card .lv-label { font-size: 12px; color: var(--muted); }
  .level-card.locked {
    background: #e2e8f0;
    color: #94a3b8;
    box-shadow: none;
    cursor: not-allowed;
  }
  .level-card.locked .num, .level-card.locked .lv-label { color: #94a3b8; }
  .level-card.locked .lock { font-size: 34px; }

  /* ---------- GAME SHARED ---------- */
  #screen-game { justify-content: space-between; overflow: hidden; }
  .game-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    max-width: 860px;
    margin: 0 auto;
  }
  .game-info { text-align: center; flex: 1; min-width: 0; }
  .game-info .level-name {
    font-weight: bold;
    font-size: clamp(14px, 3vw, 19px);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .progress-dots {
    display: flex; gap: 6px; justify-content: center; margin-top: 6px; flex-wrap: wrap;
  }
  .dot-item {
    width: 13px; height: 13px; border-radius: 50%;
    background: #cbd5e1;
    transition: background .2s ease, transform .2s ease;
  }
  .dot-item.done { background: #22c55e; transform: scale(1.15); }
  .game-counter {
    font-weight: bold; font-size: clamp(15px, 3vw, 20px);
    min-width: 52px; text-align: right;
  }
  .hearts {
    text-align: center;
    font-size: clamp(18px, 4.2vw, 28px);
    letter-spacing: 5px;
    margin-top: 4px;
    line-height: 1;
  }
  .task {
    text-align: center;
    margin: 6px auto 0;
    font-size: clamp(14px, 3vw, 20px);
    color: var(--muted);
    min-height: 1.4em;
    max-width: 720px;
  }
  .task b { color: var(--ink); }

  #stage { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .stage-view { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .stage-view.hidden { display: none; }

  /* ---------- COLOR GAME ---------- */
  .tray {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 120px;
  }
  .shape-wrap {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: grab;
    touch-action: none;
  }
  .shape-wrap.dragging { cursor: grabbing; z-index: 1000; }
  .shape-label {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 14px;
    margin-bottom: 10px;
    background: #fff;
    border-radius: 999px;
    font-weight: bold;
    font-size: clamp(14px, 3vw, 19px);
    box-shadow: 0 4px 10px rgba(0,0,0,.12);
    white-space: nowrap;
  }
  .shape-label .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
  .shape-slot {
    width: var(--shape-size);
    height: var(--shape-size);
    filter: drop-shadow(0 10px 12px rgba(0,0,0,.22));
    animation: pop .35s ease;
  }
  .shape-slot svg { width: 100%; height: 100%; display: block; }
  .shape-wrap:not(.dragging) .shape-slot { animation: idle 2.6s ease-in-out infinite; }
  @keyframes pop {
    0%   { transform: scale(0) rotate(-30deg); }
    70%  { transform: scale(1.1) rotate(6deg); }
    100% { transform: scale(1) rotate(0deg); }
  }
  @keyframes idle {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-8px); }
  }
  .bins {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(72px, 1fr));
    gap: clamp(8px, 2vw, 18px);
    width: 100%;
    max-width: 860px;
    margin: 0 auto;
    padding-bottom: 6px;
  }
  .bin {
    aspect-ratio: 1 / 1.02;
    border-radius: 16px 16px 24px 24px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    border: 4px solid rgba(255,255,255,.9);
    box-shadow: inset 0 -8px 16px rgba(0,0,0,.18), 0 8px 14px rgba(0,0,0,.12);
    transition: transform .14s ease, box-shadow .14s ease;
  }
  .bin.hover {
    transform: translateY(-10px) scale(1.06);
    box-shadow: 0 0 0 5px rgba(255,255,255,.75), 0 14px 22px rgba(0,0,0,.2);
  }
  .bin.correct { animation: bounce .5s ease; }
  .bin.wrong   { animation: shake .4s ease; }
  @keyframes bounce {
    0%,100% { transform: translateY(0) scale(1); }
    40%     { transform: translateY(-18px) scale(1.1); }
  }

  /* ---------- MATH GAME ---------- */
  .question-card {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(16px, 4vh, 30px);
    width: 100%;
  }
  .question {
    font-size: clamp(38px, 10vw, 72px);
    font-weight: bold;
    color: #1e293b;
    background: #fff;
    padding: clamp(14px, 3vw, 24px) clamp(22px, 6vw, 48px);
    border-radius: 26px;
    box-shadow: 0 10px 24px rgba(0,0,0,.12);
    text-align: center;
    min-width: min(320px, 86vw);
    animation: qIn .3s ease;
  }
  @keyframes qIn {
    from { transform: scale(.85); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }
  .answers {
    display: grid;
    grid-template-columns: repeat(2, minmax(120px, 1fr));
    gap: clamp(10px, 2.5vw, 18px);
    width: 100%;
    max-width: 480px;
  }
  .answer {
    padding: clamp(14px, 3.5vw, 22px) 10px;
    font-size: clamp(24px, 6vw, 38px);
    font-weight: bold;
    border-radius: 18px;
    background: #fff;
    color: var(--ink);
    box-shadow: 0 6px 0 rgba(0,0,0,.12), 0 8px 16px rgba(0,0,0,.08);
    transition: transform .08s ease, background .15s ease, color .15s ease;
  }
  .answer:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.12); }
  .answer.correct { background: #22c55e; color: #fff; }
  .answer.wrong { background: #ef4444; color: #fff; animation: shake .4s ease; }
  .answer:disabled { cursor: default; }

  /* ---------- EMOJI / FLASH ---------- */
  .feedback {
    position: fixed;
    left: 50%;
    top: 40%;
    transform: translate(-50%, -50%) scale(0);
    font-size: clamp(80px, 22vw, 170px);
    line-height: 1;
    pointer-events: none;
    z-index: 3500;
    opacity: 0;
  }
  .feedback.show-correct { animation: happyPop .9s ease; }
  .feedback.show-wrong   { animation: sadPop .9s ease; }
  @keyframes happyPop {
    0%   { transform: translate(-50%,-50%) scale(0) rotate(-30deg); opacity: 0; }
    30%  { transform: translate(-50%,-50%) scale(1.35) rotate(10deg); opacity: 1; }
    60%  { transform: translate(-50%,-50%) scale(1.05) rotate(-5deg); opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(1) rotate(0); opacity: 0; }
  }
  @keyframes sadPop {
    0%   { transform: translate(-50%,-50%) scale(0); opacity: 0; }
    30%  { transform: translate(-50%,-50%) scale(1.15); opacity: 1; }
    55%  { transform: translate(-50%,-50%) scale(1) translateX(-8px); opacity: 1; }
    70%  { transform: translate(-50%,-50%) scale(1) translateX(8px); opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(.9); opacity: 0; }
  }
  .flash {
    position: fixed; inset: 0; background: #fff;
    opacity: 0; pointer-events: none; z-index: 3400;
  }
  .flash.go { animation: flashAnim .55s ease; }
  @keyframes flashAnim {
    0% { opacity: 0; }
    20% { opacity: .8; }
    100% { opacity: 0; }
  }

  /* ---------- OVERLAY ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 3000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(15,23,42,.45);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .overlay.hidden { display: none; }
  .card {
    background: #fff;
    border-radius: 28px;
    padding: clamp(22px, 5vw, 40px);
    text-align: center;
    max-width: 440px;
    width: 100%;
    box-shadow: 0 24px 48px rgba(0,0,0,.3);
    animation: cardIn .3s ease;
  }
  @keyframes cardIn {
    from { transform: scale(.8); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }
  .card h2 { margin: 0 0 8px; font-size: clamp(22px, 5vw, 32px); }
  .stars-big {
    font-size: clamp(34px, 9vw, 54px);
    letter-spacing: 4px;
    margin: 6px 0 10px;
  }
  .card p { color: var(--muted); margin: 0 0 20px; font-size: clamp(14px, 3vw, 18px); }
  .card-buttons { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .fail-emoji { font-size: clamp(50px, 14vw, 80px); line-height: 1; margin-bottom: 6px; }

  #confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 4000; }
  .confetti-piece {
    position: absolute; top: -20px;
    width: 10px; height: 16px; border-radius: 3px;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity: .9; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- ===== WELCOME ===== -->
  <section id="screen-login" class="screen active">
    <div class="art">👋 🌈 🎮</div>
    <h1>Welcome!</h1>
    <p class="sub">What is your name?</p>
    <input id="player-name" class="name-input" type="text" maxlength="20" placeholder="Type your name" autocomplete="off" />
    <button id="btn-login" class="btn big">Start ▶</button>
  </section>

  <!-- ===== GAME SELECT ===== -->
  <section id="screen-games" class="screen">
    <div class="games-header">
      <h1>Choose a Game</h1>
      <p class="greeting" id="greeting"></p>
    </div>
    <div class="game-cards">
      <button class="game-card color-card" data-game="color">
        <div class="card-art">🔴 🟦 🔺 ⭐ ❤️</div>
        <div class="card-title">Color &amp; Shape Sorter</div>
        <div class="card-sub">Sort colorful shapes into the matching color bins</div>
        <div class="card-play">Play ▶</div>
      </button>
      <button class="game-card math-card" data-game="math">
        <div class="card-art">➕ ➖ ✖️ ➗</div>
        <div class="card-title">Play with Math</div>
        <div class="card-sub">Answer fun math questions and level up</div>
        <div class="card-play">Play ▶</div>
      </button>
    </div>
    <button id="btn-change-name" class="link-btn">Not you? Change name</button>
  </section>

  <!-- ===== LEVEL SELECT ===== -->
  <section id="screen-levels" class="screen">
    <div class="topbar">
      <button class="btn icon" id="btn-levels-games" aria-label="Games">🎮</button>
      <h2 id="levels-title">Choose a Level</h2>
      <div class="spacer"></div>
    </div>
    <div class="levels-sub" id="levels-sub"></div>
    <div id="level-grid" class="level-grid"></div>
  </section>

  <!-- ===== GAME ===== -->
  <section id="screen-game" class="screen">
    <div class="game-top">
      <button class="btn icon" id="btn-game-back" aria-label="Back">⬅</button>
      <div class="game-info">
        <div class="level-name"><span id="game-title">Game</span> · Level <span id="game-level">1</span></div>
        <div class="progress-dots" id="progress-dots"></div>
      </div>
      <div class="game-counter"><span id="game-done">0</span>/<span id="game-total">3</span></div>
    </div>

    <div class="hearts" id="hearts"></div>
    <div class="task" id="task"></div>

    <div id="stage">
      <!-- Color & Shape -->
      <div id="stage-color" class="stage-view">
        <div class="tray" id="tray">
          <div class="shape-wrap" id="shape-wrap">
            <div class="shape-label" id="shape-label"><span class="dot"></span><span id="shape-name">Red Circle</span></div>
            <div class="shape-slot" id="shape-slot"></div>
          </div>
        </div>
        <div class="bins" id="bins"></div>
      </div>

      <!-- Math -->
      <div id="stage-math" class="stage-view hidden">
        <div class="question-card">
          <div class="question" id="question">7 + 5 = ?</div>
          <div class="answers" id="answers"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== LEVEL COMPLETE ===== -->
  <div id="overlay-complete" class="overlay hidden">
    <div class="card">
      <h2 id="complete-title">Level Complete!</h2>
      <div class="stars-big" id="complete-stars">⭐⭐⭐</div>
      <p id="complete-msg">Great job!</p>
      <div class="card-buttons">
        <button class="btn" id="btn-replay">🔄 Replay</button>
        <button class="btn primary" id="btn-next">Next Level ▶</button>
        <button class="btn" id="btn-levels">📋 Levels</button>
      </div>
    </div>
  </div>

  <!-- ===== LEVEL FAILED ===== -->
  <div id="overlay-fail" class="overlay hidden">
    <div class="card">
      <div class="fail-emoji">😢</div>
      <h2>Level Failed</h2>
      <p id="fail-msg">Too many wrong tries. Let's try again!</p>
      <div class="card-buttons">
        <button class="btn primary" id="btn-try-again">Try Again 🔄</button>
        <button class="btn" id="btn-fail-levels">📋 Levels</button>
      </div>
    </div>
  </div>

  <div id="feedback" class="feedback" aria-hidden="true"></div>
  <div id="flash" class="flash"></div>
  <div id="confetti"></div>
</div>

<script>
(function () {
  "use strict";

  /* =======================================================================
     DATA
     ======================================================================= */

  const COLORS = {
    red:    { hex: "#ef4444", name: "Red" },
    blue:   { hex: "#3b82f6", name: "Blue" },
    yellow: { hex: "#f59e0b", name: "Yellow" },
    green:  { hex: "#22c55e", name: "Green" },
    orange: { hex: "#f97316", name: "Orange" },
    purple: { hex: "#a855f7", name: "Purple" },
    pink:   { hex: "#ec4899", name: "Pink" },
    brown:  { hex: "#b45309", name: "Brown" },
    cyan:   { hex: "#06b6d4", name: "Cyan" },
    lime:   { hex: "#84cc16", name: "Lime" },
    gray:   { hex: "#64748b", name: "Gray" },
    navy:   { hex: "#1e3a8a", name: "Navy" }
  };

  const SHAPES = {
    circle:   { name: "Circle",   svg: '<circle cx="50" cy="50" r="45"/>' },
    square:   { name: "Square",   svg: '<rect x="7" y="7" width="86" height="86" rx="12"/>' },
    triangle: { name: "Triangle", svg: '<polygon points="50,7 94,92 6,92"/>' },

  const C8  = ["red","blue","yellow","green","orange","purple","pink","brown"];
  const C9  = C8.concat(["cyan"]);
  const C10 = C9.concat(["lime"]);

  const COLOR_LEVELS = [
    { colors: ["red","blue"],                                           shapes: ["circle","square"],                                     rounds: 3  },
    { colors: ["red","blue","yellow"],                                  shapes: ["circle","square","triangle"],                          rounds: 4  },
    { colors: ["red","blue","yellow","green"],                          shapes: ["circle","square","triangle","star"],                   rounds: 4  },
    { colors: ["red","blue","yellow","green","orange"],                 shapes: ["circle","square","triangle","star","heart"],           rounds: 5  },
    { colors: ["red","blue","yellow","green","orange","purple"],        shapes: ["circle","square","triangle","star","heart","diamond"], rounds: 5  },
    { colors: ["red","blue","yellow","green","orange","purple","pink"], shapes: ["circle","square","triangle","star","heart","diamond","oval"], rounds: 6 },
    { colors: ["red","blue","yellow","green","orange","purple","pink","brown"], shapes: S10.slice(0, 8), rounds: 6 },
    { colors: C8, shapes: S10.slice(0, 9), rounds: 7 },

  /* ---- Math generators ---- */
  function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function genAdd(max) {
    const a = randInt(1, max - 1);
    const b = randInt(1, max - a);
    return { text: a + " + " + b + " = ?", answer: a + b };
  }
  function genSub(max) {
    const a = randInt(2, max);
    const b = randInt(1, a);
    return { text: a + " − " + b + " = ?", answer: a - b };
  }
  function genMul(table) {
    const a = randInt(1, table);
    const b = randInt(1, 10);
    return { text: a + " × " + b + " = ?", answer: a * b };
  }
  function genDiv(table) {
    const b = randInt(1, table);
    const ans = randInt(1, 10);
    const a = b * ans;
    return { text: a + " ÷ " + b + " = ?", answer: ans };
  }
  function genMaster() {
    const pick = randInt(0, 3);
    if (pick === 0) return genAdd(50);
    if (pick === 1) return genSub(50);
    if (pick === 2) return genMul(10);
    return genDiv(10);
  }

  const MATH_LEVELS = [
    { name: "Add to 10",    rounds: 5, gen: function () { return genAdd(10); } },
    { name: "Take Away 10", rounds: 5, gen: function () { return genSub(10); } },
    { name: "Add to 20",    rounds: 5, gen: function () { return genAdd(20); } },
    { name: "Take Away 20", rounds: 5, gen: function () { return genSub(20); } },
    { name: "Mix + and −",  rounds: 6, gen: function () { return randInt(0, 1) ? genAdd(20) : genSub(20); } },
    { name: "Add to 50",    rounds: 6, gen: function () { return genAdd(50); } },
    { name: "Take Away 50", rounds: 6, gen: function () { return genSub(50); } },
    { name: "Times 1–5",    rounds: 6, gen: function () { return genMul(5); } },
    { name: "Times 1–10",   rounds: 6, gen: function () { return genMul(10); } },
    { name: "Divide",       rounds: 6, gen: function () { return genDiv(10); } },
    { name: "Mix × and ÷",  rounds: 7, gen: function () { return randInt(0, 1) ? genMul(10) : genDiv(10); } },
    { name: "Math Master",  rounds: 8, gen: function () { return genMaster(); } }
  ];

  const GAMES = {
    color: {
      title: "Color & Shape Sorter",
      tip: "Drag each shape into its matching color bin.",
      levels: COLOR_LEVELS,
      defaultMaxWrong: 3,
      levelDesc: function (cfg) { return cfg.colors.length + " colors · " + cfg.shapes.length + " shapes"; }
    },
    math: {
      title: "Play with Math",
      tip: "Tap the correct answer. Be careful — you only have 3 hearts!",
      levels: MATH_LEVELS,
      defaultMaxWrong: 3,
      levelDesc: function (cfg) { return cfg.rounds + " questions"; }
    }
  };

  /* =======================================================================
     ELEMENTS
     ======================================================================= */

  const screens = {
    login:  document.getElementById("screen-login"),
    games:  document.getElementById("screen-games"),
    levels: document.getElementById("screen-levels"),
    game:   document.getElementById("screen-game")
  };
  const loginNameInput = document.getElementById("player-name");
  const greetingEl     = document.getElementById("greeting");
  const levelsTitle    = document.getElementById("levels-title");
  const levelsSub      = document.getElementById("levels-sub");
  const levelGrid      = document.getElementById("level-grid");
  const gameTitleEl    = document.getElementById("game-title");
  const gameLevelEl    = document.getElementById("game-level");
  const gameDoneEl     = document.getElementById("game-done");
  const gameTotalEl    = document.getElementById("game-total");
  const dotsEl         = document.getElementById("progress-dots");
  const heartsEl       = document.getElementById("hearts");
  const taskEl         = document.getElementById("task");
  const stageColor     = document.getElementById("stage-color");
  const stageMath      = document.getElementById("stage-math");
  const shapeWrap      = document.getElementById("shape-wrap");
  const shapeSlot      = document.getElementById("shape-slot");
  const shapeName      = document.getElementById("shape-name");
  const labelDot       = document.querySelector("#shape-label .dot");
  const binsEl         = document.getElementById("bins");
  const questionEl     = document.getElementById("question");
  const answersEl      = document.getElementById("answers");

  const completeTitle  = document.getElementById("complete-title");
  const completeStars  = document.getElementById("complete-stars");
  const completeMsg    = document.getElementById("complete-msg");
  const btnNext        = document.getElementById("btn-next");
  const overlayFail    = document.getElementById("overlay-fail");
  const failMsgEl      = document.getElementById("fail-msg");
  const feedbackEl     = document.getElementById("feedback");
  const flashEl        = document.getElementById("flash");
  const confettiEl     = document.getElementById("confetti");

  /* =======================================================================
     NAME
     ======================================================================= */

  const NAME_KEY = "color-shape-sorter-player";
  let playerName = "";
  try { playerName = localStorage.getItem(NAME_KEY) || ""; } catch (e) {}

  function saveName(name) {
    playerName = name;
    try { localStorage.setItem(NAME_KEY, name); } catch (e) {}
  }

  /* =======================================================================
     STATE
     ======================================================================= */

  let currentGameKey = null;
  let levelIndex = 0;
  let done = 0;
  let mistakes = 0;
  let busy = false;
  let session = 0;

  let currentColor = null;
  let currentShape = null;
  let currentMath = null;
  let lastCombo = "";
  let lastMathText = "";

  const progress = {
    color: { unlocked: 1, stars: {} },
    math:  { unlocked: 1, stars: {} }
  };

  function resetProgress() {
    progress.color = { unlocked: 1, stars: {} };
    progress.math = { unlocked: 1, stars: {} };
  }

  function game() { return GAMES[currentGameKey]; }
  function levelCfg() { return game().levels[levelIndex]; }
  function maxWrong() { return levelCfg().maxWrong || game().defaultMaxWrong; }

  /* =======================================================================
     SOUND
     ======================================================================= */

  let audioCtx = null;
  function getAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function beep(freq, start, dur, type, vol) {
    const ctx = getAudio();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || "sine";
    osc.frequency.value = freq;
    const t = ctx.currentTime + start;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(vol || 0.18, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.05);
  }
  function soundCorrect() { beep(523.25, 0, 0.15); beep(659.25, 0.1, 0.15); beep(783.99, 0.2, 0.22); }
  function soundWrong() { beep(180, 0, 0.22, "sawtooth", 0.12); beep(120, 0.12, 0.25, "sawtooth", 0.12); }
  function soundWin() { [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) { beep(f, i * 0.12, 0.3, "triangle", 0.18); }); }
  function soundFail() { beep(392, 0, 0.2, "sawtooth", 0.14); beep(311.13, 0.16, 0.25, "sawtooth", 0.14); beep(233.08, 0.34, 0.4, "sawtooth", 0.14); }

  const HAPPY_EMOJI = ["😄", "😁", "🤩", "😊", "🥳"];
  const SAD_EMOJI   = ["😢", "😟", "☹️", "😞"];
  function showEmoji(isCorrect) {
    const list = isCorrect ? HAPPY_EMOJI : SAD_EMOJI;
    feedbackEl.textContent = list[randInt(0, list.length - 1)];
    feedbackEl.className = "feedback";
    void feedbackEl.offsetWidth;
    feedbackEl.classList.add(isCorrect ? "show-correct" : "show-wrong");
    if (isCorrect) {
      flashEl.classList.remove("go");
      void flashEl.offsetWidth;
      flashEl.classList.add("go");
    }
  }

  function confetti() {
    const colors = ["#ef4444", "#3b82f6", "#f59e0b", "#22c55e", "#a855f7", "#ec4899", "#f97316"];
    for (let i = 0; i < 60; i++) {
      const p = document.createElement("div");
      p.className = "confetti-piece";
      p.style.left = Math.random() * 100 + "vw";
      p.style.background = colors[randInt(0, colors.length - 1)];
      p.style.animationDuration = (1.6 + Math.random() * 1.7) + "s";
      p.style.animationDelay = (Math.random() * 0.5) + "s";
      p.style.transform = "rotate(" + Math.random() * 360 + "deg)";
      confettiEl.appendChild(p);
      setTimeout(function () { p.remove(); }, 4400);
    }
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = randInt(0, i);
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  function makeChoices(answer) {
    const set = [answer];
    const spread = Math.max(4, Math.ceil(Math.abs(answer) * 0.25));
    let guard = 0;
    while (set.length < 4 && guard < 300) {
      guard++;
      const delta = randInt(-spread, spread);
      if (delta === 0) continue;
      const v = answer + delta;
      if (v < 0) continue;
      if (set.indexOf(v) === -1) set.push(v);
    }
    let n = answer + 1;
    while (set.length < 4) {
      if (set.indexOf(n) === -1) set.push(n);
      n++;
    }
    return shuffle(set);
  }

  /* =======================================================================
     NAVIGATION
     ======================================================================= */

  function showScreen(name) {
    Object.keys(screens).forEach(function (k) {
      screens[k].classList.toggle("active", k === name);
    });
  }

  function doLogin() {
    const name = loginNameInput.value.trim();
    if (!name) {
      loginNameInput.classList.add("shake");
      setTimeout(function () { loginNameInput.classList.remove("shake"); }, 450);
      loginNameInput.focus();
      return;
    }
    if (name !== playerName) resetProgress();
    saveName(name);
    greetingEl.textContent = "Hi, " + name + "! 👋";
    getAudio();
    showScreen("games");
  }

  function chooseGame(key) {
    getAudio();
    currentGameKey = key;
    renderLevels();
    showScreen("levels");
  }

  /* =======================================================================
     LEVEL SELECT
     ======================================================================= */

  function renderLevels() {
    levelsTitle.textContent = game().title;
    levelsSub.textContent = "Choose a level to play";
    levelGrid.innerHTML = "";

    const p = progress[currentGameKey];
    game().levels.forEach(function (cfg, i) {
      const levelNo = i + 1;
      const unlocked = levelNo <= p.unlocked;
      const stars = p.stars[levelNo] || 0;

      const card = document.createElement("button");
      card.className = "level-card " + (unlocked ? "unlocked" : "locked");
      card.disabled = !unlocked;

      if (unlocked) {
        card.innerHTML =
          '<div class="num">' + levelNo + '</div>' +
          (cfg.name ? '<div class="lv-name">' + cfg.name + '</div>' : '') +
          '<div class="lv-stars">' + "⭐".repeat(stars) + "☆".repeat(3 - stars) + '</div>' +
          '<div class="lv-label">' + game().levelDesc(cfg) + '</div>';
        card.addEventListener("click", function () { getAudio(); startLevel(i); });
      } else {
        card.innerHTML =
          '<div class="lock">🔒</div>' +
          (cfg.name ? '<div class="lv-name">' + cfg.name + '</div>' : '') +
          '<div class="lv-label">Level ' + levelNo + '</div>';
      }
      levelGrid.appendChild(card);
    });
  }

  /* =======================================================================
     GAME FLOW
     ======================================================================= */

  function startLevel(index) {
    levelIndex = index;
    done = 0;
    mistakes = 0;
    busy = false;
    session++;
    currentColor = null;
    currentShape = null;
    currentMath = null;
    lastCombo = "";
    lastMathText = "";

    const cfg = levelCfg();
    gameTitleEl.textContent = game().title;
    gameLevelEl.textContent = index + 1;
    gameDoneEl.textContent = "0";
    gameTotalEl.textContent = cfg.rounds;

    buildDots(cfg.rounds);
    renderHearts();

    if (currentGameKey === "color") {
      stageColor.classList.remove("hidden");
      stageMath.classList.add("hidden");
    } else {
      stageMath.classList.remove("hidden");
      stageColor.classList.add("hidden");
    }

    showScreen("game");
    nextRound();
  }

  function nextRound() {
    if (done >= levelCfg().rounds) { completeLevel(); return; }
    if (currentGameKey === "color") startColorRound();
    else startMathRound();
    updateDots();
    busy = false;
  }

  function buildDots(n) {
    dotsEl.innerHTML = "";
    for (let i = 0; i < n; i++) {
      const d = document.createElement("span");
      d.className = "dot-item";
      dotsEl.appendChild(d);
    }
  }
  function updateDots() {
    const items = dotsEl.children;
    for (let i = 0; i < items.length; i++) {
      items[i].classList.toggle("done", i < done);
    }
    gameDoneEl.textContent = done;
  }
  function renderHearts() {
    const max = maxWrong();
    const left = Math.max(0, max - mistakes);
    heartsEl.textContent = "❤️".repeat(left) + "🖤".repeat(max - left);
  }

  /* ---- shared result handling ---- */

  function resolveCorrect() {
    if (busy) return;
    busy = true;
    const s = session;
    soundCorrect();
    showEmoji(true);
    done++;
    updateDots();
    taskEl.textContent = "Great job! 🎉";
    setTimeout(function () {
      if (s !== session) return;
      if (done >= levelCfg().rounds) completeLevel();
      else nextRound();
    }, 750);
  }

  function resolveWrong() {
    if (busy) return;
    mistakes++;
    soundWrong();
    showEmoji(false);
    renderHearts();
    taskEl.textContent = "Oops! Try again. 🙂";
    const s = session;

    if (mistakes >= maxWrong()) {
      busy = true;
      setTimeout(function () {
        if (s !== session) return;
        failLevel();
      }, 800);
    } else {
      busy = true;
      setTimeout(function () {
        if (s !== session) return;
        busy = false;
        restoreTask();
      }, 700);
    }
  }

  function restoreTask() {
    if (currentGameKey === "color") restoreColorTask();
    else taskEl.textContent = "Tap the correct answer!";
  }

  function completeLevel() {
    const levelNo = levelIndex + 1;
    const p = progress[currentGameKey];
    const stars = Math.max(1, 3 - mistakes);

    if (!p.stars[levelNo] || stars > p.stars[levelNo]) p.stars[levelNo] = stars;
    if (levelNo < game().levels.length) p.unlocked = Math.max(p.unlocked, levelNo + 1);

    completeTitle.textContent = "Level " + levelNo + " Complete!";
    completeStars.textContent = "⭐".repeat(stars) + "☆".repeat(3 - stars);
    completeMsg.textContent =
      stars === 3 ? "Perfect! Everything correct! 🎉" :
      stars === 2 ? "Well done! Keep going for 3 stars!" :
                    "Good job! Try again for more stars.";

    if (levelNo < game().levels.length) {
      btnNext.textContent = "Next Level ▶";
      btnNext.dataset.action = "next";
    } else {
      btnNext.textContent = "Finish 🎊";
      btnNext.dataset.action = "finish";
    }

    overlay.classList.remove("hidden");
    soundWin();
    confetti();
    busy = true;
  }

  function failLevel() {
    soundFail();
    showEmoji(false);
    failMsgEl.textContent =
      "You made " + maxWrong() + " wrong tries. Let's try this level again!";
    overlayFail.classList.remove("hidden");
    busy = true;
  }

  /* =======================================================================
     COLOR GAME
     ======================================================================= */

  function makeShapeSvg(type, colorHex) {
    return '<svg viewBox="0 0 100 100" style="color:' + colorHex + '" fill="currentColor" ' +
           'stroke="rgba(255,255,255,.85)" stroke-width="3" stroke-linejoin="round">' +
           SHAPES[type].svg + '</svg>';
  }

  function startColorRound() {
    const cfg = levelCfg();
    let color, shape, combo, guard = 0;
    do {
      color = cfg.colors[randInt(0, cfg.colors.length - 1)];
      shape = cfg.shapes[randInt(0, cfg.shapes.length - 1)];
      combo = color + ":" + shape;
      guard++;
    } while (combo === lastCombo && guard < 20 && cfg.colors.length * cfg.shapes.length > 1);

    lastCombo = combo;
    currentColor = color;
    currentShape = shape;

    const ci = COLORS[color];
    const si = SHAPES[shape];
    shapeSlot.innerHTML = makeShapeSvg(shape, ci.hex);
    shapeName.textContent = ci.name + " " + si.name;
    labelDot.style.background = ci.hex;

    buildBins(cfg.colors);
    restoreColorTask();
  }

  function restoreColorTask() {
    if (!currentColor) return;
    const ci = COLORS[currentColor];
    const si = SHAPES[currentShape];
    taskEl.innerHTML =
      'Drag the <b>' + ci.name + " " + si.name + '</b> into the <b>' + ci.name + '</b> bin.';
  }

  function buildBins(colors) {
    binsEl.innerHTML = "";
    const minBin = colors.length > 10 ? 56 : colors.length > 8 ? 62 : 72;
    binsEl.style.gridTemplateColumns = "repeat(auto-fit, minmax(" + minBin + "px, 1fr))";
    colors.forEach(function (key) {
      const bin = document.createElement("div");
      bin.className = "bin";
      bin.dataset.color = key;
      bin.style.background = COLORS[key].hex;
      bin.setAttribute("role", "img");
      bin.setAttribute("aria-label", COLORS[key].name + " color bin");
      binsEl.appendChild(bin);
    });
  }

  /* ---- color drag & drop (bound once) ---- */

  let drag = null;

  shapeWrap.addEventListener("pointerdown", function (e) {
    if (busy || currentGameKey !== "color") return;
    getAudio();
    const rect = shapeWrap.getBoundingClientRect();
    drag = {
      offsetX: e.clientX - rect.left,
      offsetY: e.clientY - rect.top
    };
    shapeWrap.classList.add("dragging");
    shapeWrap.style.position = "fixed";
    shapeWrap.style.left = rect.left + "px";
    shapeWrap.style.top = rect.top + "px";
    shapeWrap.style.width = rect.width + "px";
    shapeWrap.style.height = rect.height + "px";
    shapeWrap.style.margin = "0";
    try { shapeWrap.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });

  shapeWrap.addEventListener("pointermove", function (e) {
    if (!drag) return;
    shapeWrap.style.left = (e.clientX - drag.offsetX) + "px";
    shapeWrap.style.top = (e.clientY - drag.offsetY) + "px";
    const r = shapeWrap.getBoundingClientRect();
    highlightBinAt(r.left + r.width / 2, r.top + r.height / 2);
  });

  shapeWrap.addEventListener("pointerup", function (e) {
    if (!drag) return;
    let bin = binAtShape();
    if (!bin) bin = binAt(e.clientX, e.clientY);
    clearHighlights();

    if (bin && !busy && currentColor) {
      if (bin.dataset.color === currentColor) {
        bin.classList.add("correct");
        setTimeout(function () { bin.classList.remove("correct"); }, 700);
        resolveCorrect();
      } else {
        bin.classList.add("wrong");
        setTimeout(function () { bin.classList.remove("wrong"); }, 700);
        resolveWrong();
      }
    }
    resetDrag();
  });

  shapeWrap.addEventListener("pointercancel", function () {
    clearHighlights();
    resetDrag();
  });

  function resetDrag() {
    drag = null;
    shapeWrap.classList.remove("dragging");
    shapeWrap.style.position = "";
    shapeWrap.style.left = "";
    shapeWrap.style.top = "";
    shapeWrap.style.width = "";
    shapeWrap.style.height = "";
    shapeWrap.style.margin = "";
  }

  function binAt(x, y) {
    const bins = binsEl.querySelectorAll(".bin");
    for (let i = 0; i < bins.length; i++) {
      const r = bins[i].getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return bins[i];
    }
    return null;
  }
  function binAtShape() {
    const r = shapeWrap.getBoundingClientRect();
    return binAt(r.left + r.width / 2, r.top + r.height / 2);
  }
  function highlightBinAt(x, y) {
    const target = binAt(x, y);
    const bins = binsEl.querySelectorAll(".bin");
    for (let i = 0; i < bins.length; i++) {
      bins[i].classList.toggle("hover", bins[i] === target);
    }
  }
  function clearHighlights() {
    const bins = binsEl.querySelectorAll(".bin");
    for (let i = 0; i < bins.length; i++) bins[i].classList.remove("hover");
  }

  /* =======================================================================
     MATH GAME
     ======================================================================= */

  function startMathRound() {
    const cfg = levelCfg();
    let q, guard = 0;
    do {
      q = cfg.gen();
      guard++;
    } while (q.text === lastMathText && guard < 15);

    lastMathText = q.text;
    currentMath = q;

    questionEl.textContent = q.text;
    questionEl.style.animation = "none";
    void questionEl.offsetWidth;
    questionEl.style.animation = "";

    answersEl.innerHTML = "";
    makeChoices(q.answer).forEach(function (val) {
      const b = document.createElement("button");
      b.className = "answer";
      b.textContent = val;
      b.dataset.value = val;
      b.addEventListener("click", function () { onAnswer(b, val); });
      answersEl.appendChild(b);
    });

    taskEl.textContent = "Tap the correct answer!";
  }

  function onAnswer(btn, val) {
    if (busy || btn.disabled || !currentMath) return;
    if (val === currentMath.answer) {
      btn.classList.add("correct");
      Array.prototype.forEach.call(answersEl.children, function (b) { b.disabled = true; });
      resolveCorrect();
    } else {
      btn.classList.add("wrong");
      btn.disabled = true;
      resolveWrong();
    }
  }

  /* =======================================================================
     BUTTONS
     ======================================================================= */

  document.getElementById("btn-login").addEventListener("click", doLogin);
  loginNameInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); doLogin(); }
  });
  document.getElementById("btn-change-name").addEventListener("click", function () {
    loginNameInput.value = playerName || "";
    showScreen("login");
    setTimeout(function () { loginNameInput.focus(); }, 120);
  });

  document.querySelectorAll(".game-card").forEach(function (card) {
    card.addEventListener("click", function () { chooseGame(card.dataset.game); });
  });

  document.getElementById("btn-levels-games").addEventListener("click", function () {
    resetProgress();
    showScreen("games");
  });

  document.getElementById("btn-game-back").addEventListener("click", function () {
    session++;
    busy = false;
    resetDrag();
    clearHighlights();
    renderLevels();
    showScreen("levels");
  });

  document.getElementById("btn-replay").addEventListener("click", function () {
    overlay.classList.add("hidden");
    startLevel(levelIndex);
  });
  btnNext.addEventListener("click", function () {
    overlay.classList.add("hidden");
    if (btnNext.dataset.action === "next") startLevel(levelIndex + 1);
    else { renderLevels(); showScreen("levels"); }
  });
  document.getElementById("btn-levels").addEventListener("click", function () {
    overlay.classList.add("hidden");
    renderLevels();
    showScreen("levels");
  });

  document.getElementById("btn-try-again").addEventListener("click", function () {
    overlayFail.classList.add("hidden");
    startLevel(levelIndex);
  });
  document.getElementById("btn-fail-levels").addEventListener("click", function () {
    overlayFail.classList.add("hidden");
    renderLevels();
    showScreen("levels");
  });

  /* =======================================================================
     INIT
     ======================================================================= */

  loginNameInput.value = playerName || "";
  if (playerName) greetingEl.textContent = "Hi, " + playerName + "! 👋";
  showScreen("login");
  setTimeout(function () {
    if (!playerName) loginNameInput.focus();
  }, 200);
})();
</script>
</body>
</html>
